system:
  description: >-
    <p class="p1">The prayer spell seeks short-term favor&nbsp;from the gods to
    help some other spell or&nbsp;attack to succeed. Prayer affects a 20-foot
    x&nbsp;20-foot area, causing a saving throw penalty&nbsp;to all creatures in
    that area. The penalty is a&nbsp;&ndash;1, plus an additional &ndash;1 for
    every 10 caster&nbsp;levels. Thus, a 10th-level Cleric causes a&nbsp;saving
    throw penalty of &ndash;2. The penalty&nbsp;actually takes effect in the
    melee round&nbsp;following the one in which it was cast.</p>
