system:
  description: >-
    <p class="p1">When this spell is cast, a mystical druidic&nbsp;force issues
    forth from a place designated&nbsp;by the caster, in roughly the shape of a
    wall&nbsp;120 feet across. This power rolls forward at&nbsp;a rate of 5 feet
    per round directly away from&nbsp;the caster, inexorably pressing all wood,
    or&nbsp;wooden objects, backward. Once the power&nbsp;is set in motion, it
    cannot be stopped other&nbsp;than by the caster&rsquo;s command.</p>
