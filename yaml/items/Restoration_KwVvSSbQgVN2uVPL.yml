  description: >-
    <p class="p1">This spell restores levels lost to such
    horrible&nbsp;creatures as wraiths and shadows. An evil&nbsp;reversal of the
    spell allows a Chaotically-aligned Cleric to drain a level from
    the&nbsp;target. The &ldquo;good&rdquo; version of the spell is exhausting
    to the caster, incapacitating him for&nbsp;2d10 days. At the discretion of
    the Referee,&nbsp;this spell may restore lost points of
    attribute&nbsp;scores as well as lost levels.</p>
