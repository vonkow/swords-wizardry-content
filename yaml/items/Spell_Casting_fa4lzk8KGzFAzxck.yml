system:
  description: >-
    <p class="p1">Clerics cast &ldquo;divine&rdquo; spells from a specific
    list,&nbsp;with numbers as per the Cleric Advancement Table. Clerics&nbsp;of
    specific deities might have different lists of available spells,&nbsp;as
    designed by the Referee. Each day, the Cleric selects and&nbsp;prays for a
    particular set of spells, choosing any spells from the&nbsp;standard list.
    Once a spell is cast, it cannot be cast again until&nbsp;the next day unless
    the Cleric prepares (prays for) the spell&nbsp;more than once.</p>
