img: systems/swords-wizardry/assets/game-icons-net/pentacle.svg
system:
  description: >-
    <p>This spell summons a demon or other fiend (such as a devil) from the
    lower planes of existence. The spell provides no protection whatsoever
    against the wrath of the summoned creature, and the Magic-User should be
    versed in the lore of pentacles and other magical means of hedging out
    demons. Gaining the demon’s assistance is beyond the spell’s power, coming
    down to a matter of negotiations and threats between the caster and the
    fiend.</p>
