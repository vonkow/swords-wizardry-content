img: systems/swords-wizardry/assets/game-icons-net/healing.svg
system:
  description: >-
    <p class="p1">This spell (also known as &ldquo;raise dead
    fully&rdquo;)&nbsp;raises the dead back to life in the same manner as the
    raise dead spell. It is, however,&nbsp;considerably more powerful: the
    person&nbsp;raised from the dead needs no time to recuperate from the
    experience of death and&nbsp;suffers no other penalties. An evil
    &ldquo;reversal&rdquo;&nbsp;of the spell can also be cast, which
    causes&nbsp;death with no saving throw.</p>
