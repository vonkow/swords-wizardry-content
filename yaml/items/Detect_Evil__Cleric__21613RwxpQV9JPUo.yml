system:
  description: >-
    <p class="p1">The caster detects any evil enchantments,&nbsp;evil
    intentions, evil thoughts, or evil auras&nbsp;within the spell&rsquo;s
    range. Poison is not inherently evil and cannot be detected by means&nbsp;of
    this spell. Whether there is any&nbsp;distinction between &ldquo;evil&rdquo;
    and &ldquo;Chaos&rdquo; is&nbsp;left to the Referee; in most campaigns,
    they&nbsp;are exactly the same. Clerics of Chaos may&nbsp;cast a reversed
    version of this spell to detect&nbsp;good rather than evil.</p>
