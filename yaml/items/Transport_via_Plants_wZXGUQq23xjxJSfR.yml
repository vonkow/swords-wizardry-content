name: Transport via Plants
type: spell
_id: wZXGUQq23xjxJSfR
img: systems/swords-wizardry/assets/game-icons-net/beanstalk.svg
system:
  description: >-
    <p class="p1">The caster may enter any normal plant and&nbsp;pass any
    distance to a chosen plant of the&nbsp;same kind in a single round,
    regardless of&nbsp;the distance separating the two. Both plants&nbsp;must be
    alive. The caster may also choose to&nbsp;remain in one or the other of the
    two plants&nbsp;for up to 24 hours, but the destruction of an&nbsp;occupied
    plant slays the caster and ejects the&nbsp;body from the plant. The caster
    becomes&nbsp;aware of all plants within 3,000 feet, and&nbsp;the spell will
    not fail if the attempted travel&nbsp;is made within this radius. However,
    if the&nbsp;caster attempts to travel beyond this radius&nbsp;into the
    substance of a plant the caster has&nbsp;never before seen &mdash; meaning
    that specific&nbsp;plant, not just the species &mdash; there is a
    20%&nbsp;chance of error during travel. The exact&nbsp;nature of the error
    depends upon specific&nbsp;circumstances, but it is likely to be off by
    a&nbsp;margin of at least 1d6 miles, into any other&nbsp;sort of plant.</p>
  spellLevel: '6'
  range: Touch first plant
  duration: 24 hours or until travel is completed
