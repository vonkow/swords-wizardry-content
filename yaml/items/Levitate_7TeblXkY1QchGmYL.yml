img: systems/swords-wizardry/assets/game-icons-net/lift.svg
system:
  description: >-
    <p>This spell allows the Magic-User to levitate himself, moving vertically
    up or down, but the spell itself provides no assistance with lateral
    movement. A wall, cliff side, or ceiling could, of course, be used to pull
    along hand-over-hand. Levitation allows up- or downward movement at a rate
    of up to 6 feet per minute (60 feet per turn), and the caster cannot
    levitate more than 20 feet per level from the ground level where the spell
    was cast. (Such range is applied to movement into the air and to downward
    movement into a pit or chasm.)</p>
  spellLevel: '2'
  range: 20 feet/level
  duration: 1 turn/level
