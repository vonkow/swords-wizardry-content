system:
  description: >-
    <p>The caster detects any evil enchantments, evil intentions, evil thoughts,
    or evil auras within the spell’s range. Poison is not inherently evil and
    cannot be detected by means of this spell. Whether there is any meaningful
    distinction between “evil” and “Chaos” is left to the Referee; in most
    campaigns they are exactly the same.</p>
