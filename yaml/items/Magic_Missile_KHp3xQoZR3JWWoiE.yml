system:
  description: >-
    <p class="p1">A magical missile flies where the caster&nbsp;directs, with a
    range of 150 feet. At the Referee&rsquo;s discretion, this spell may have
    one of&nbsp;two effects: 1) The Magic-User must roll to&nbsp;hit the target
    with a +1 bonus to the roll.&nbsp;The missile inflicts 1d6+1 points of
    damage.&nbsp;2) The missile hits automatically, doing&nbsp;1d4+1 points of
    damage.</p>

    <p class="p1">In either case, the Magic-User casts an&nbsp;additional two
    missiles for every 5 levels of&nbsp;experience. Thus, at 5th level, the
    caster is&nbsp;able to hurl 3 magic missiles, and 5 missiles&nbsp;at 10th
    level.</p>
