system:
  description: >-
    <p class="p1">The Cleric causes a powerful earthquake&nbsp;in an area 60 x
    60 feet plus an additional&nbsp;10 feet (in both length and width) per
    three&nbsp;levels above 17th. The quake topples walls,&nbsp;causes
    rockslides, and opens gaping fissures&nbsp;in the earth. Any creature caught
    in the&nbsp;quake has a 1-in-6 chance of falling into&nbsp;the depths of the
    earth and being killed.&nbsp;The earthquake&rsquo;s tremors do not extend
    in&nbsp;any way beyond the spell&rsquo;s area of effect.</p>
