img: systems/swords-wizardry/assets/game-icons-net/tree-door.svg
system:
  description: >-
    <p class="p1">The caster may step into one tree and&nbsp;emerge from a
    distant tree of the same kind;&nbsp;both trees must be living, and have a
    girth&nbsp;as large as the caster&rsquo;s own. The caster need&nbsp;not step
    out of the first tree immediately, but&nbsp;may wait within the tree for as
    long as desired (up to the limit of the spell&rsquo;s duration)&nbsp;before
    leaving. It is possible for the caster to&nbsp;step from tree to tree in
    series without ending the spell; however, upon emerging from&nbsp;any tree
    into the outside, the caster ends the&nbsp;spell. The table below shows the
    maximum&nbsp;distance the caster may travel in a single&nbsp;step; this is
    also the maximum total distance&nbsp;that can be traveled in a single
    casting of the&nbsp;spell, even if the caster moves through multiple trees.
    Upon casting the spell, the caster&nbsp;becomes aware of the various trees
    within&nbsp;the range of the spell, so there is no chance&nbsp;of
    &ldquo;missing&rdquo; the target.</p>

