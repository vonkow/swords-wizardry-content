system:
  description: >-
    <p>As with a hold portal spell, wizard lock holds a door closed, but it is
    permanent until dispelled. Creatures with magic resistance can shatter the
    spell without effort. Any Magic-User at least three levels higher than the
    caster can open the portal, and a knock spell will open it as well, although
    the spell is not permanently destroyed in these cases.</p>
