system:
  description: >-
    <p class="p1">Upon reaching 11th level, a Druid&nbsp;may build a stronghold
    in the wilderness, usually made up of a&nbsp;stone circle and/or other
    megaliths, one or more groves, and a&nbsp;fortress redoubt of some kind to
    protect the area. Such isolated&nbsp;strongholds often serve as informal
    academies for aspirant Druids-in-training, or as fortresses sited to defend
    wilderness areas&nbsp;threatened by Law or Chaos. A Druid who establishes
    such a&nbsp;stronghold gathers supporters and followers, although many
    of&nbsp;these will not be human.</p>
