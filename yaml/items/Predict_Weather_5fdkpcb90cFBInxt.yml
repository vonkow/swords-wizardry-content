system:
  description: >-
    <p class="p1">The Druid silently drinks in knowledge&nbsp;from the
    surrounding area, becoming&nbsp;attuned to the patterns of air, wind,
    earth&nbsp;and fire. Within moments, the character&nbsp;can predict what the
    weather conditions will&nbsp;be for the next 12 hours in the
    immediate&nbsp;vicinity (2 square miles/level). As with most&nbsp;forecasts
    of weather, conditions may change&nbsp;unexpectedly, giving rise to a 5%
    chance&nbsp;that the Druid&rsquo;s prediction will, ultimately,&nbsp;prove
    to be incorrect.</p>
