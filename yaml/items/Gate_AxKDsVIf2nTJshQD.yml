system:
  description: >-
    <p>A gate spell creates an opening to another plane of existence and summons
    forth a specified, tremendously powerful being from the other plane,
    including gods, demi-gods, demons, etc. The caster must know the name of the
    creature being summoned or the spell fails. There is a 5% chance that the
    wrong being might be summoned forth, and (regardless whether the summoned
    being is the right one or not) there is a 5% chance that it lacks interest
    in the situation and returns through the gate. The summoned being is not
    necessarily friendly to the caster, and may even be extremely annoyed.</p>
