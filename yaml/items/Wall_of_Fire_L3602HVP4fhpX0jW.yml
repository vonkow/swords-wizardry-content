name: Wall of Fire
type: spell
_id: L3602HVP4fhpX0jW
img: systems/swords-wizardry/assets/game-icons-net/firewall.svg
system:
  description: >-
    <p class="p1">A wall of fire flares into being and burns for&nbsp;as long as
    the caster concentrates upon it.&nbsp;Creatures with 3 or fewer hit dice
    cannot&nbsp;pass through it, and no creature can see&nbsp;through it to the
    other side. Passing through&nbsp;the fire inflicts 1d6 hit points of damage
    (no&nbsp;saving throw) and undead creatures sustain&nbsp;twice the normal
    damage. The caster may&nbsp;choose to create a straight wall 60 feet
    long&nbsp;and 20 feet high, or a circular wall with a&nbsp;15-foot radius,
    also 20 feet high.</p>
  spellLevel: '5'
  range: 60 feet
  duration: Concentration
