system:
  description: >-
    <p>This spell is not all-powerful; it grants wishes of limited scope
    (although more powerful than a limited wish). The Referee’s discretion will
    rule what sort of wishes are within the spell’s power. (One possible —
    unofficial — guideline might be that a wish can grant effects that would be
    similar in power to an 8th-level spell or lower, with permanent effects in
    many cases.) After casting a wish spell, the Magic-User is mentally drained
    and unable to cast spells for a period of 1d4 days.</p>
