  description: >-
    <p>The Dwarf player character&nbsp;easily&nbsp;takes note of certain
    features of stonework:&nbsp;sloping corridors, moving walls, and
    traps&nbsp;made of stone &mdash; in particular, falling&nbsp;blocks, rigged
    ceilings, and tiny arrow slits&nbsp;designed to release poison gas or darts.
    They&nbsp;can also identify whether stonework is recent&nbsp;or not. There
    is no established die roll or&nbsp;rule for using these abilities; exactly
    what a&nbsp;Dwarf does or does not perceive is up to the&nbsp;Referee.</p>
