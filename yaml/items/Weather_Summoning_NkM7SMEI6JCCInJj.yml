img: systems/swords-wizardry/assets/game-icons-net/sun-cloud.svg
system:
  description: >-
    <p class="p1">Within 30 minutes, whatever weather the&nbsp;Druid desires
    forms in the surrounding&nbsp;five-mile radius. It is not under the
    caster&rsquo;s control, in the sense that it will not&nbsp;specifically
    target any individuals or affect&nbsp;one place within the radius more than
    any&nbsp;other place. Note that this spell is not by&nbsp;any means the only
    way in which groups of&nbsp;druids might exercise control over weather
    conditions using holy places or acting&nbsp;together in mystic rituals. It
    is simply the&nbsp;manner by which a lone (but powerful)&nbsp;Druid can
    summon forth weather conditions using no ritual beyond mere
    spellcasting.</p>
  spellLevel: '6'
  range: Centered on caster
  duration: 1 hour/level
