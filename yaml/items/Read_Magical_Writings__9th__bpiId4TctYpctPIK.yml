    complicated (that is, for spells higher than 6th&nbsp;level). Thieves can
    cast Magic-User spells from scrolls, but for the&nbsp;high-level spells they
    have a 10% chance to get a dangerously unpredictable result, usually the
    reverse of the intended effect.</p>
