system:
  description: >-
    <p class="p1">The Cleric &ldquo;brings to life&rdquo; inanimate
    objects&nbsp;such as statues, chairs, carpets, and tables.&nbsp;The objects
    follow the Cleric&rsquo;s commands,&nbsp;attacking foes or performing other
    actions&nbsp;on the caster&rsquo;s behalf. The Referee must determine the
    combat attributes of the objects&nbsp;(such as armor class, speed, hit dice,
    and to-hit bonuses) on the spur of the moment. A&nbsp;stone statue, as a
    basic example, might have <strong>AC</strong> of 1[18], attack as a creature
    with 7&ndash;9&nbsp;hit dice, and inflict 2d8 points of damage.&nbsp;Wooden
    furniture would be considerably&nbsp;less dangerous.</p>
  spellLevel: '6'
  range: 60 feet
  duration: 1 hour
