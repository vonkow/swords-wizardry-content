  description: >-
    <p>At 8th level, a Ranger&rsquo;s scholarship allows the character to use
    certain magic items not normally&nbsp;usable by fighter-types. Rangers of
    this level can employ Clerical&nbsp;healing scrolls and any other magic
    items that heal damage or disease. Note that if the item has other abilities
    in addition to healing,&nbsp;the Ranger cannot employ these other powers
    unless the item is&nbsp;normally usable by Fighters.</p>
