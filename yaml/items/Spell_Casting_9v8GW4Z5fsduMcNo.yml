system:
  description: >-
    <p class="p1">Druids cast spells from a specific list, with numbers&nbsp;as
    per the Druid Advancement Table. Each day, the Druid selects&nbsp;and prays
    for a particular set of spells, choosing any spells from the&nbsp;standard
    Druid spell list. Once a spell is cast, it cannot be cast again&nbsp;until
    the next day, unless the Druid prepares (prays for) the spell&nbsp;more than
    once.</p>
