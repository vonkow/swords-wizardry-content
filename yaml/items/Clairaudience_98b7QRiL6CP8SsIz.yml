  description: >-
    <p>Clairaudience allows the caster to hear any sounds within a range of 60
    feet through solid stone (which limits the spell’s range to 2 feet or so)
    and other obstacles. The spell’s effect cannot pass through even a thin
    sheeting of lead, however, for this metal blocks it utterly. The spell can
    be cast through a crystal ball.</p>
