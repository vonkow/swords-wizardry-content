system:
  description: >-
    <p>Fibrous, sticky webs fill an area up to 10 x 10 x 20 feet. It is
    extremely difficult to get through the mass of strands — it takes one turn
    if a torch and sword (or a flaming sword) are used, and creatures larger
    than a horse can break through in two turns. Humans alone take more time to
    break through — perhaps three to four turns or longer at the Referee’s
    discretion.</p>
