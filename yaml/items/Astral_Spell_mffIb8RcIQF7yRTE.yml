name: Astral Spell
type: spell
_id: mffIb8RcIQF7yRTE
img: systems/swords-wizardry/assets/game-icons-net/psychic-waves.svg
system:
  description: >-
    <p class="p1">The caster projects his or her astral form&nbsp;into other
    places. The astral form is invisible to all creatures but those also
    traveling&nbsp;the Astral Plane of existence. The spell&nbsp;has a duration
    of two hours. If the caster&rsquo;s&nbsp;physical body is moved more than
    100&nbsp;miles from its original location while the&nbsp;astral form is
    away, the link is sundered and&nbsp;the caster&rsquo;s soul becomes lost in
    the beyond.&nbsp;(If the caster&rsquo;s body is underground, it&nbsp;need
    only be moved 100 yards before the&nbsp;connection is broken.)</p>

    <p class="p1">The astral form is capable of casting spells,&nbsp;but there
    is a 5% chance per spell level&nbsp;that the spell fails. Additionally,
    there is a&nbsp;2% chance per spell level of the attempted&nbsp;spell that
    the astral spell itself falters as a&nbsp;result of the spellcasting, and
    the astral&nbsp;form returns to the physical body. When&nbsp;traveling in
    astral form upon the earth, the&nbsp;astral form may travel as fast as 100
    miles&nbsp;per hour per level above 18th. If the form&nbsp;is traveling
    underground, its top speed is&nbsp;much slower: 120 feet per 10-minute
    turn.&nbsp;When traveling into the deeper regions&nbsp;beyond the earth,
    speed and distance are&nbsp;obviously not measured in miles.</p>
  spellLevel: '7'
  range: 100 miles (aboveground), 100 yards (belowground)
  duration: 2 hours
