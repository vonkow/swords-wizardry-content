system:
  description: >-
    <p class="p1">Protection from fire may be cast on another person, but it
    confers a great deal more&nbsp;eldritch warding if it is woven
    personally&nbsp;around the caster. When used to protect&nbsp;another
    creature, the spell&rsquo;s warding grants&nbsp;complete immunity to normal
    fire and cuts&nbsp;damage from magical fire in half. When&nbsp;used to ward
    the caster, the spell also grants&nbsp;complete immunity against one
    exposure&nbsp;to magical fire, after which it functions&nbsp;normally.</p>
