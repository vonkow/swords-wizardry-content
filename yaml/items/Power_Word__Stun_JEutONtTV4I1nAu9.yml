system:
  description: >-
    <p>The caster speaks a word of power to a particular creature. If that
    creature has 35 or fewer hit points, it is instantly stunned for 2d6 turns;
    if the creature has from 36 to 70 hit points, it is stunned for only 1d6
    turns. If the creature has more than 70 hit points, it is not affected by
    the spell. No saving throw is permitted.</p>
