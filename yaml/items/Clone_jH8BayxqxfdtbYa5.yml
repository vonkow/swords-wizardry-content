system:
  description: >-
    <p>By this eerie and disturbing spell, a piece of flesh taken from a living
    person is grown into an exact duplicate of the person at the time the flesh
    was removed. (Whether this requires a laboratory and how much time is needed
    to regrow the clone depend upon the spell formula and the Referee’s
    discretion.) If a clone is created while its parent-creature still lives,
    the clone seeks to kill its original. If it fails to achieve this goal, both
    the clone and the original become insane.</p>
