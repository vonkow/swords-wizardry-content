system:
  description: >-
    <p class="p1">The Monk can touch any creature&nbsp;of equal or lesser hit
    dice, and create an attunement by which the&nbsp;creature dies instantly
    when the Monk gives a mental command for&nbsp;its heart to stop. (The
    creature must have a heart or other organ that&nbsp;can be stopped.) The
    creature&rsquo;s bodily vibrations remain attuned to&nbsp;the Monk for a
    period of one day per level of the Monk, and if the&nbsp;Monk does not
    mentally command the creature to die within this period of time, the death
    does not occur. This ability may not be used&nbsp;more frequently than once
    per week.</p>
