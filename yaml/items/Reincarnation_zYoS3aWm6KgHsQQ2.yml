system:
  description: >-
    <p class="p1">This spell brings a dead person&rsquo;s soul back&nbsp;from
    the dead, but the soul reappears in a&nbsp;newly formed body. Druidic
    reincarnation&nbsp;will not affect someone who has been dead&nbsp;more than
    a week. Roll 1d100, and on a&nbsp;roll of 01&ndash;75 the result is
    determined from&nbsp;the same table as would be used for a
    Magic-User&rsquo;s reincarnation spell (below). If the&nbsp;percentile dice
    gave a result of 76&ndash;00, roll&nbsp;1d6 on the following table:</p>

    <h3 class="p1"><span class="s1">Druidic Reincarnation</span></h3>

    <table style="width: 100%; height: 112px;" border="1"><colgroup><col
    style="width: 38.1053%;"><col style="width: 61.8947%;"></colgroup>

    <tbody>

    <tr style="height: 16px;">

    <td style="height: 16px;"><strong>Die Roll (1d6)</strong></td>

    <td style="height: 16px;"><strong>Reincarnated as &hellip;</strong></td>

    </tr>

    <tr style="height: 16px;">

    <td style="height: 16px;">1</td>

    <td style="height: 16px;">Bear</td>

    </tr>

    <tr style="height: 16px;">

    <td style="height: 16px;">2</td>

    <td style="height: 16px;">Lion</td>

    </tr>

    <tr style="height: 16px;">

    <td style="height: 16px;">3</td>

    <td style="height: 16px;">Mouse</td>

    </tr>

    <tr style="height: 16px;">

    <td style="height: 16px;">4</td>

    <td style="height: 16px;">Raven</td>

    </tr>

    <tr style="height: 16px;">

    <td style="height: 16px;">5</td>

    <td style="height: 16px;">Stag</td>

    </tr>

    <tr style="height: 16px;">

    <td style="height: 16px;">6</td>

    <td style="height: 16px;">Wolf</td>

    </tr>

    </tbody>

    </table>
