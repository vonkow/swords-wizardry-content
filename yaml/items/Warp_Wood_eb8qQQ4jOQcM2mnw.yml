system:
  description: >-
    <p class="p1">This spell warps, bends, and twists wood.&nbsp;The volume of
    about one 2-inch x 4-inch&nbsp;x 5-foot plank may be affected per
    every&nbsp;two levels of the caster &mdash; the volume of a&nbsp;spear or
    several arrows. However, keep in&nbsp;mind that springing a door open or
    causing&nbsp;a leak in a ship&rsquo;s planking does not
    actually&nbsp;require much of the constituent wood to be&nbsp;warped.</p>
