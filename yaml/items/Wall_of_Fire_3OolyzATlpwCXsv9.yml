img: systems/swords-wizardry/assets/game-icons-net/firewall.svg
system:
  description: >-
    <p>A wall of fire flares into being and burns for as long as the caster
    concentrates upon it. Creatures with 3 or fewer hit dice cannot pass through
    it, and no creature can see through it to the other side. Passing through
    the fire inflicts 1d6 hit points of damage (no saving throw) and undead
    creatures sustain twice the normal damage. The caster may choose to create a
    straight wall 60 feet long and 20 feet high, or a circular wall with a
    15-foot radius, also 20 feet high.</p>
