system:
  description: >-
    <p>The caster speaks a word of power to a particular creature. If that
    creature has 40 hit points or fewer, it is instantly blinded for 2d4 days;
    if the creature has from 41 to 80 hit points, it is blinded for 1d4 days. If
    the creature has more than 80 hit points, it is not affected by the spell.
    No saving throw applies.</p>
