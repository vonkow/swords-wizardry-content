system:
  description: >-
    <p class="p1">This spell opens a pathway for the caster&nbsp;through even
    the deepest and most tangled&nbsp;growths of plants, thorns, and trees.
    The&nbsp;pathway can be made up to 5 feet wide, 6&nbsp;feet tall, and 100
    feet in length, but only&nbsp;the caster can move through it. The
    Druid&nbsp;may choose to remain housed safely inside&nbsp;a tree, if the
    spell has opened a passage&nbsp;through one. It is possible to remain
    within&nbsp;the tree after the spell expires; for as long as&nbsp;desired,
    in fact, before leaving it.</p>
  spellLevel: '4'
  range: Passage begins where caster stands
  duration: 3 turns + 1 turn/level
