system:
  description: >-
    <p class="p1"><strong>Climbing walls or cliffs</strong>. The percentage
    chance is what the thief needs to climb a wall that others cannot climb. If
    the wall is more difficult than normal (very slippery, for example), the
    referee may lower a thief &rsquo;s chances of success. In general, if a
    normal person has a chance to climb a wall, a thief can most likely do it
    automatically.</p>

    <h3 class="p1">Climb Walls Advancement Table</h3>

    <p>Assassins have skills similar to those of Thieves, but comparable to a
    Thief two levels lower than the Assassin character.</p>

