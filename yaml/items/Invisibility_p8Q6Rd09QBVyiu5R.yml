system:
  description: >-
    <p>The object of this spell, whether a person or a thing, becomes invisible
    to both normal sight and darkvision. The result is that an invisible
    creature cannot be attacked unless its approximate location is known, and
    all attacks are made at –4 to hit. If the invisible creature makes an
    attack, the spell is broken. Otherwise, it lasts until dispelled or removed
    by the caster.</p>
  spellLevel: '2'
  range: 240 feet
  duration: Until dispelled or an attack is made
