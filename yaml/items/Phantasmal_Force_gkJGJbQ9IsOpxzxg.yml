img: systems/swords-wizardry/assets/game-icons-net/magick-trick.svg
system:
  description: >-
    <p>This spell creates an illusion that seems realistic to all who view it.
    The illusion disappears when it is touched, but if the viewer believes the
    illusion is real, it can cause damage. Unless the Referee rules otherwise,
    victims of the spell are permitted a saving throw, and the illusion cannot
    cause more than 2d6 points of damage per victim. This depends on
    circumstances; a truly brilliant use of the spell can be quite devastating,
    and a poorly thought-out illusion might cause almost immediate
    disbelief.</p>
