img: systems/swords-wizardry/assets/game-icons-net/covered-jar.svg
system:
  description: >-
    <p>This spell relocates the caster’s life essence, intelligence, and soul
    into an object of virtually any kind. The “jar” must be within 30 feet of
    the caster’s body for the transition to succeed. Once within the magic jar,
    the caster can possess the bodies of other creatures and people, provided
    that they are within 120 feet of the jar and fail a saving throw. The caster
    can return his or her soul to the magic jar at any time; if a body the
    caster controls is slain, the soul returns to the jar immediately. The
    Magic-User can return from the jar to his or her original body whenever
    desired, thus ending the spell. If the caster’s body is destroyed while his
    or her soul is in the magic jar, the soul no longer has a home other than
    within the magic jar, although the disembodied wizard can still possess
    other bodies as before. If the jar itself is destroyed while the
    Magic-User’s soul is within, the soul is lost.</p>
