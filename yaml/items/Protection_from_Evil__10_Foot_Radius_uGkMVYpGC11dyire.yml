name: Protection from Evil, 10-Foot Radius
type: spell
_id: uGkMVYpGC11dyire
img: systems/swords-wizardry/assets/game-icons-net/aura.svg
system:
  description: >-
    <p>The spell creates a magical field of protection, 10 feet in radius,
    around the caster. The field blocks out all enchanted monsters (such as
    elementals and demons). Evil monsters suffer a –1 penalty to hit anyone
    within the protective globe, and these shielded individuals gain +1 on all
    saving throws against such attacks. If a person in the circle already has
    any magical bonuses to saving throws or armor class, the bonus from the
    magic circle has no effect for that person, although the protective circle
    still functions against enchanted creatures. This spell may be reversed by a
    Cleric of Chaos to protect from good.</p>
  spellLevel: '3'
  range: Centered on caster
  duration: 1 hour
