system:
  description: >-
    <p class="p1"><strong>Delicate tasks</strong>. This percentage chance is
    used for disabling&nbsp;small mechanical traps such as poisoned needles and
    is also used for&nbsp;picking pockets. The skill is also used to detect
    whether a mechanism, keyhole, or other small location contains a trap that
    can be&nbsp;removed.</p>

