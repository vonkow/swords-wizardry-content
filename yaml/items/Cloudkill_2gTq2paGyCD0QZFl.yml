img: systems/swords-wizardry/assets/game-icons-net/poison-cloud.svg
system:
  description: >-
    <p>Foul and poisonous vapors boil from the thin air and form a cloud 15 feet
    in radius. The cloud moves directly forward at a rate of 6 feet per minute
    unless its direction or speed is affected by winds. Unusually strong gusts
    can dissipate and destroy the cloud. Poison-laden, the horrid mist is
    heavier than air, and thus sinks down any pits or stairs in its path. For
    any creature with fewer than 5 hit dice, touching the cloud (much less
    breathing it) requires a saving throw to avoid immediate death.</p>
