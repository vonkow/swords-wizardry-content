img: systems/swords-wizardry/assets/game-icons-net/summits.svg
system:
  description: >-
    <p class="p1">The caster brings rock to life, perhaps by&nbsp;calling a
    spirit into it, or perhaps by some&nbsp;other means related to the druidic
    affinity&nbsp;for stone and the elements. The mass of&nbsp;rock, whether or
    not it is shaped into an object, moves and attacks of its own
    volition.&nbsp;The druid has roughly a 50% +2% per level&nbsp;chance to be
    able to bring the object under&nbsp;control; otherwise it acts somewhat
    randomly, having little or no independent intelligence. The quantity of rock
    that can be&nbsp;animated is a function of the druid&rsquo;s power&nbsp;and
    is about 2&ndash;3 cubic feet per level. If the&nbsp;animated rock is a
    statue, it moves at a speed&nbsp;appropriate to whatever the statue depicts
    (a&nbsp;wolf statue, for example, moves faster than&nbsp;the statue of a
    man). A formless mass of&nbsp;rock has a movement rate of 3.</p>
  spellLevel: '7'
