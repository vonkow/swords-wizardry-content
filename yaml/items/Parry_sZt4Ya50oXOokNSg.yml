system:
  description: >-
    <p class="p1">Fighters with a Dexterity score of 14 or better can fight
    on&nbsp;the defensive, parrying enemy blows and dodging attacks, as
    shown&nbsp;on the table below. The Fighter can parry at any time,
    without&nbsp;giving up the ability to attack in the same round. Parrying is
    not&nbsp;effective against missile weapons, but is effective against claws,
    bites&nbsp;and touch attacks.</p>

    <h3 class="p1">Fighter Parrying Ability</h3>

    <table border="1"><colgroup><col><col></colgroup>

    <tbody>

    <tr>

    <td><strong>Dexterity Score</strong></td>

    <td><strong>Penalty to Enemy Attacks</strong></td>

    </tr>

    <tr>

    <td>14</td>

    <td>-1</td>

    </tr>

    <tr>

    <td>15</td>

    <td>-2</td>

    </tr>

    <tr>

    <td>16</td>

