system:
  description: >-
    <p class="p1">Assassins may attack from behind with a to-hit bonus of +4 and
    inflict double damage. This damage multiplier increases&nbsp;at the same
    level as that of a Thief.</p>

    <p class="p1">The original rules did not provide any &ldquo;automatic
    kill&rdquo; abilities for&nbsp;Assassins, other than for hired Assassins, as
    a way of determining&nbsp;success or failure on a mission. The Referee might
    choose to allow&nbsp;Assassin characters to add the Assassin&rsquo;s level
    of experience to damage inflicted by a backstabbing attack.</p>
