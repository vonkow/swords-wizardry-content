system:
  description: >-
    <p class="p1">At 14th level, the Assassin may establish&nbsp;(or take over)
    a guild of Assassins. The guild need not be located&nbsp;in a large city and
    can even be established as a barony in the&nbsp;wilderness. However, if the
    new guild is within the territory of an&nbsp;existing guild, there will
    unquestionably be a battle to the death&nbsp;between them. Assassins&rsquo;
    guilds do not &mdash; ever &mdash; share their&nbsp;territory. An existing
    guild of Assassins will generally not accept the&nbsp;leadership of a new
    guildmaster who does not claim that rank by&nbsp;killing the former
    guildmaster</p>
