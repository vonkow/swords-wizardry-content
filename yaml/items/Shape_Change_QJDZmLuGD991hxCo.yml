name: Shape Change
type: spell
_id: QJDZmLuGD991hxCo
img: systems/swords-wizardry/assets/game-icons-net/werewolf.svg
system:
  description: >-
    <p>When the caster casts this spell upon him- or herself, it allows the
    caster to turn at will into a variety of creatures. In each form, the wizard
    gains the characteristics of the creature, much as with the polymorph others
    spell. Thus, turning into a dragon actually allows the caster to use the
    dragon’s breath weapon. The caster might then choose to turn into a raven,
    then a frog, or whatever other creature is chosen. It is not, of course,
    required that the caster use more than one shape — remaining as a dragon for
    the duration of the spell works perfectly well.</p>
  spellLevel: '9'
  range: Caster
  duration: 1d6 + 10 turns + 1 turn/level
