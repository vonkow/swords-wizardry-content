system:
  description: >-
    <p>The targeted person or object produces light as bright as sunlight (and
    with the same effects as sunlight) when cast by a Cleric, and slightly less
    bright than sunlight (and without the effects of true sunlight) when cast by
    a Magic-User. The light extends to a radius of 120 feet. Clerics of Chaos
    may cast a reversed form of the spell, causing darkness.</p>
