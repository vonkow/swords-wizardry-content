system:
  description: >-
    <p>This spell brings a dead person’s soul back from the dead, but the soul
    reappears in a newly formed body. Reincarnation will not affect someone who
    has been dead more than a week. Roll 1d20 on the following table. If the
    resulting creature is a normal character ancestry, roll 1d6 to determine the
    character’s new level.</p><p class="p2"><span
    class="s1"><strong>Reincarnation by
    Magic-Users</strong></span></p><table><tbody><tr><td><p><strong>Die Roll
    (d20)</strong></p></td><td><p><strong>Reincarnated as
    …</strong></p></td></tr><tr><td><p>1</p></td><td><p>Bugbear</p></td></tr><tr><td><p>2</p></td><td><p>Centaur</p></td></tr><tr><td><p>3</p></td><td><p>Dog,
    Cat, or
