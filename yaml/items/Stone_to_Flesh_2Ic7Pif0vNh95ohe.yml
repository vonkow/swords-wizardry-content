  description: >-
    <p>This spell can be used to counteract the negative effects of monsters who
    petrify their victims. It can also be reversed to turn flesh into stone, as
    desired by the caster. A saving throw is permitted to avoid being turned to
    stone, but if the spell succeeds, the victim is transformed into a statue;
    the stone-to-flesh version of the spell restores the victim to normal.</p>
