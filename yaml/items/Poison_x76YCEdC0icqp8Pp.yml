  description: >-
    <p class="p1">Assassins are able to use poison on their weapons
    without&nbsp;the risk of making basic errors. Fighters who coat their swords
    with poison might &mdash; just might &mdash; make the mistake of
    absentmindedly rubbing their eyes before remembering to wash the deadly
    toxin from their hands; Assassins are trained not to fall prey to such basic
    errors when using poison. Assassins are not, however, trained at concocting
    poisons; most guilds employ an alchemist for such&nbsp;purposes.</p>
