system:
  description: >-
    <p class="p1"><strong>Hiding in shadows</strong>. Thieves can make
    themselves very hard to&nbsp;see when lurking in the shadows. Anyone can
    hide, of course, but&nbsp;thieves are virtually invisible and can move
    around while hiding.</p>

    <h3 class="p1">Hide in Shadows Advancement</h3>

    <p>Assassins have skills similar to those of Thieves, but comparable to a
    Thief two levels lower than the Assassin character.</p>

