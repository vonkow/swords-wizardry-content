system:
  description: >-
    <p>Like the <strong>invisibility</strong> spell, <strong>invisibility
    10-foot radius</strong> makes the target creature or object invisible to
    normal sight and darkvision. It also, however, throws a radius of
    invisibility around the recipient, which moves with him/her/it. Nothing
    inside the radius of invisibility can be attacked unless its approximate
    location is known, and all attacks are made at –4 to hit. If an invisible
    creature makes an attack, the spell is broken. Otherwise, it lasts until
    dispelled or removed by the caster.</p>
  spellLevel: '3'
  range: 240 feet
  duration: Until dispelled or an attack is made
