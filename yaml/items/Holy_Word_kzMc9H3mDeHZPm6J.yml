system:
  description: >-
    <p class="p1">The speaking of a holy word dramatically affects all those
    within the range of its&nbsp;divine power. Creatures of fewer than 5
    hit&nbsp;dice are slain; creatures of 5&ndash;8 hit dice are&nbsp;stunned
    for 2d10 turns; and creatures with&nbsp;9&ndash;12 hit dice are deafened for
    1d6 turns.&nbsp;Creatures with 13+ hit dice are unaffected&nbsp;but probably
    impressed.</p>
  spellLevel: '7'
  range: 40-foot radius
  duration: Immediate
