system:
  description: >-
    <p class="p1">This spell of colossal power may be used&nbsp;only outdoors,
    and even then only when a&nbsp;storm is present or immediately
    imminent.&nbsp;Under such conditions, the caster may tap&nbsp;into and
    unleash the power of the storm itself, calling forth bolts of lightning from
    the&nbsp;sky at intervals of no less than 10 minutes&nbsp;in between. The
    lightning blasts straight&nbsp;downward from the heavens,
    inflicting&nbsp;damage of 8d6 hp + 1 hp/level.</p>
