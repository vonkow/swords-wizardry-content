system:
  description: >-
    <p>The caster speaks a hypnotic suggestion to the intended victim. Victims
    who fail a saving throw carry out the suggestion as long as it can be
    performed within a week. The suggestion might not call for the action to be
    carried out immediately, and can be contingent upon something else happening
    first. A suggestion that the victim commit suicide is only 1% likely to be
    obeyed.</p>
