name: Raise Dead
type: spell
_id: 4BJBEdorLGbY2K7p
img: systems/swords-wizardry/assets/game-icons-net/caduceus.svg
system:
  description: >-
    <p class="p1">Raise dead allows the Cleric to raise a&nbsp;corpse from the
    dead, provided it has not&nbsp;been dead too long. The normal time
    limit&nbsp;is five days, but for every caster level higher&nbsp;than 8th,
    the time limit extends another&nbsp;five days. Characters with low
    Constitution&nbsp;might not survive the ordeal, and even for&nbsp;those with
    strong Constitution, a period of&nbsp;at least a week is required before
    they can&nbsp;function normally. This spell functions only&nbsp;on
    &ldquo;human-like&rdquo; ancestries, that is, ones&nbsp;that can be used for
    player characters.</p>
  spellLevel: '5'
  range: Close/Touch (Referee's discretion)
  duration: Immediate
