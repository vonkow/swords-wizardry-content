system:
  description: >-
    <p class="p1">The powers of land, sky, and nature grant&nbsp;an answer to
    three questions the caster&nbsp;poses to them. The spell cannot be
    used&nbsp;while underground or within a building; a&nbsp;fourth question may
    be asked if the caster&nbsp;is in a druidic holy place. The powers
    of&nbsp;nature can respond only to questions that&nbsp;are within their
    knowledge and purview. It is&nbsp;inadvisable to use the spell more than
    once&nbsp;per week.</p>
