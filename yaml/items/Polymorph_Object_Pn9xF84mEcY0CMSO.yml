img: systems/swords-wizardry/assets/game-icons-net/transform.svg
system:
  description: >-
    <p>An object can be turned into another object, animal, vegetable, or
    mineral. The degree of change affects the spell’s duration. Animal-to-animal
    changes, vegetable-to-vegetable changes, and mineral-to-mineral changes are
    all likely to remain permanent until dispelled. Thus, turning a human into
    an orc, or turning a wall into a pile of sand, would both result in a
    permanent change. On the other hand, turning a shrub into a thinking human
    being would last only a small number of turns. Determining how long a
    proposed use of the spell lasts is the province of the Referee; it is
    important to remember that this is an 8th-level spell of considerable power
    — but not as powerful as a 9th-level wish spell.</p>
  spellLevel: '8'
  range: 240 feet
  duration: Referee's discretion
