img: systems/swords-wizardry/assets/game-icons-net/long-antennae-bug.svg
system:
  description: >-
    <p class="p1">Spiders, centipedes, and other such vermin&nbsp;boil forth
    from the ground and assemble&nbsp;into a coherent swarm within 1d3
    rounds&nbsp;(1&ndash;3 minutes). The caster may direct the&nbsp;swarm in any
    direction or toward a particular target within 60 feet of the
    swarm&rsquo;s&nbsp;location. It marches in that direction and attacks
    anything in its path, pursuing a particular target up to a distance of 240
    feet from&nbsp;the caster. The swarm is composed of 1d10&nbsp;x 100
    creatures, each of which inflicts one&nbsp;point of damage and then dies. (A
    swarm&nbsp;of 100 inflicts a total of 100 hp before being &ldquo;used
    up,&rdquo; and a swarm of 1,000 would&nbsp;eventually inflict a total of
    1,000 hp in damage if it came across enough victims.)</p>
  spellLevel: '7'
  range: 50 feet
  duration: See below
