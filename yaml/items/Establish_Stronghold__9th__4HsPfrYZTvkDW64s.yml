system:
  description: >-
    <p class="p1">At 9th level, a Fighter may establish&nbsp;a stronghold and
    attract a body of men-at-arms who swear their&nbsp;loyalty to the character
    as their liege lord (or lady). Most likely, the&nbsp;castle attracts
    peasants seeking safe places to establish homes, and&nbsp;the Fighter
    becomes more powerful and influential as the number of&nbsp;such followers
    increases. The stronghold will likely be a small territory carved from the
    wilderness, held as a freehold by the self-ennobled character.</p>
