img: systems/swords-wizardry/assets/game-icons-net/crumbling-ball.svg
system:
  description: >-
    <p>Dispel magic, although not powerful enough to permanently disenchant a
    magic item (which it nullifies for 10 minutes), can be used to completely
    dispel most other spells and enchantments.</p><p class="p1">The chance of
    successfully dispelling magic is a percentage based on the ratio of the
    level of the dispelling caster over the level of original caster (or hit
    dice of the monster). Thus, a 6th-level Magic-User attempting to dispel a
    charm cast by a 12th-level Magic-User has a 50% chance of success (6/12 =
    0.50, or 50%). If the 12th-level Magic-User was dispelling the 6th-level
    Magic-User’s charm, success would be certain (12/6 = 2.00, or 200%).</p>
  spellLevel: '3'
  range: 120 feet
  duration: 10 minutes against an item
