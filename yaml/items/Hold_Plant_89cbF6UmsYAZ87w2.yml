system:
  description: >-
    <p class="p1">The caster targets 1d4 plants or plant-creatures that become
    completely immobilized.&nbsp;(A saving throw applies for
    monster-type&nbsp;plants.) The caster may also target a single&nbsp;plant,
    in which case the saving throw is&nbsp;made with a penalty of &ndash;2. The
    spell does&nbsp;not only immobilize plants; it also temporarily arrests the
    growth of any plant, magical&nbsp;or not.</p>
