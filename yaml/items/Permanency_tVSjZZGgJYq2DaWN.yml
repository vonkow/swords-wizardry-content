img: systems/swords-wizardry/assets/game-icons-net/infinity.svg
system:
  description: >-
    <p>This spell makes the effect of another spell permanent — unless a group
    of Magic-Users of twice the caster’s level dispels it. No more than one
    permanency is ordinarily possible on any one object, and no more than two
    upon a creature. Considerable Referee discretion is required for the use of
    this spell; many spells should not be subject to being made permanent.</p>
  spellLevel: '8'
  range: See below
  duration: >-
    Permanent until dispelled by an opponent or group of opponents having twice
    as many levels as the caster.
