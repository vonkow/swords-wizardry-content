name: Wall of Ice
type: spell
_id: A4Lg5Xlo8Rue0fCe
img: systems/swords-wizardry/assets/game-icons-net/icicles-fence.svg
system:
  description: >-
    <p>The caster conjures up a wall of ice, six feet thick and non-transparent.
    The caster may choose to create a straight wall 60 feet long and 20 feet
    high, or a circular wall with a 15-foot radius, also 20 feet high. Creatures
    with 3 or fewer hit dice cannot affect the wall, but creatures of 4+ hit
    dice are able to smash through it, taking 1d6 points of damage in the
    process. Creatures with fire-based metabolisms take 2d6 instead of the
    normal 1d6. Fire spells and magical effects are negated in the vicinity of
    the wall.</p>
  spellLevel: '4'
  range: 60 feet
  duration: Concentration
