system:
  description: >-
    <p class="p1">This spell illumines an object or creature&nbsp;with an eerie,
    fey glow. The spell&rsquo;s target&nbsp;may be approximately as large as 10
    square&nbsp;feet plus 2 square feet per level of the&nbsp;caster. The spell
    can be used for diverse&nbsp;purposes, such as revealing the true dimensions
    or extent of a thing, or to prevent a&nbsp;creature from retreating into the
    darkness.&nbsp;Depending upon the precise circumstances,&nbsp;the Referee
    may allow such illumination to&nbsp;render a creature more easily hit,
    granting&nbsp;a +1 to-hit bonus to attackers.</p>
