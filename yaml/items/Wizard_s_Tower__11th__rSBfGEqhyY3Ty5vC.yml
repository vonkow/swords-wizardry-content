system:
  description: >-
    <p class="p1">At 11th level, a Magic-User gains&nbsp;the title of
    &ldquo;wizard&rdquo; and can build a stronghold to contain
    the&nbsp;necessary libraries and laboratories of a high-level mage.
    Such&nbsp;a powerful sorcerer attracts a mixed bag of mercenaries,
    strange&nbsp;servants (some with odd abilities and deformities), and
    perhaps&nbsp;even a few monsters. This colorful crew swears fealty and
    serves&nbsp;the wizard with considerable (but not unlimited) loyalty. In
    general,&nbsp;such a freehold will encompass a small territory around the
    tower as&nbsp;well &mdash; whatever quantity of wilderness the Magic-User
    chooses to&nbsp;tame and protect.</p>
