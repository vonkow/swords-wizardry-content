  alignment: C
  description: >-
    <p class="p1"><em>Spell-like abilities:</em> 1/day&mdash;darkness 15ft
    radius, stinking cloud (20ft radius, save or nauseated for 1d4+1 rounds),
    summon 1d4 giant rats.</p>

    <p class="p1">These creatures are fat, with long, spindly arms and legs.
    They have rudimentary human heads, with slobbering jaws and folds of fat.
    Dretch demons have some weak demonic powers. Although they are not
    particularly intelligent, they can cause a horrible stinking cloud once per
    day, can teleport once per day, can cause darkness (10-foot diameter) once
    per day, and can summon 1d4 giant rats once per day. The stinking cloud has
    a radius of 20 feet and requires anyone caught within it to make a saving
    throw or be rendered helpless from nausea for 1d4+1 rounds.</p>

    <hr>

    <p class="p1"><em>Demons are creatures of the lower planes of existence, but
    they are occasionally encountered in places where they have been enslaved to
    serve as guardians by powerful Magic-Users or evil Clerics. The more
    intelligent varieties might also be interrupted while carrying out plots of
    their own. There is no meaningful game distinction between demons and
    devils; all are creatures of the lower planes.</em></p>
