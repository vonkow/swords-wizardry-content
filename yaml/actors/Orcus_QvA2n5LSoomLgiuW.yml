  alignment: C
  description: >-
    <p class="p1"><em>Spell-like abilities: at will</em>&mdash;animate dead,
    charm&nbsp;monster, darkness 15ft radius, dispel magic,&nbsp;ESP, fear,
    lightning bolt, speak with the&nbsp;dead, symbol (any), wall of fire;
    1/day&mdash;feeblemind.</p>

    <p class="p1"><strong>Equipment</strong>:<strong> </strong>Wand of Orcus (+3
    heavy mace,&nbsp;slays living creatures it touches [save or
    die],&nbsp;3/day&mdash;animate dead, darkness 15ft radius,&nbsp;fear;
    2/day&mdash;unholy word).</p>

    <p class="p1">Orcus is one of the strongest (if not the&nbsp;strongest) and
    most powerful of all demon&nbsp;lords. Known as the Prince of the
    Undead,&nbsp;he fights a never-ending war against rival&nbsp;demon princes
    that spans several Abyssal&nbsp;layers. From his great bone palace he
    commands his troops as they wage war across&nbsp;the smoldering and stinking
    planes of the&nbsp;Abyss. Orcus spends most of his days in his&nbsp;palace,
    rarely leaving its confines unless he&nbsp;decides to lead his troops into
    battle (which&nbsp;has happened on more than one occasion).&nbsp;Most of the
    time though, he is content to&nbsp;let his generals and commanders lead
    the&nbsp;battles.</p>

    <p class="p1">Orcus is a squat, bloated humanoid standing 15 feet tall and
    weighing 3 tons. His&nbsp;goat-like head sports large, spiraling ram-like
    horns, and his legs are covered in thick&nbsp;brown fur and end in hooves.
    Two large,&nbsp;black, bat-like wings protrude from his back&nbsp;and a
    long, snake-like tail, tipped with a&nbsp;sharpened barb, trails behind
    it.</p>

    <p class="p1">When not warring against rival demon&nbsp;princes, Orcus likes
    to travel the planes,&nbsp;particularly the Material Plane. Should
    a&nbsp;foolish spellcaster open a gate and speak his&nbsp;name, he is more
    than likely going to hear&nbsp;the call and step through to the
    Material&nbsp;Plane. What happens to the spellcaster that&nbsp;called him
    usually depends on the reason&nbsp;for the summons and the power of
    the&nbsp;spellcaster. Extremely powerful spellcasters&nbsp;are usually slain
    after a while and turned&nbsp;into undead soldiers or generals in
    the&nbsp;demon lord&rsquo;s armies.</p>

    <h2 class="p1">Combat</h2>

    <p class="p1">Orcus prefers to fight using his wand. His&nbsp;tail sting
    delivers a virulent poison (save or&nbsp;die). Orcus can command or banish
    undead&nbsp;as a 15th-level cleric, controlling up to 150&nbsp;HD worth of
    undead at one time. He casts&nbsp;spells as a 15th-level Cleric and
    12th-level&nbsp;Magic-user, and can use the following magical abilities at
    will: animate dead, charm&nbsp;monster, darkness, dispel magic, ESP,
    fear,&nbsp;lightning bolt, speak with the dead, symbol&nbsp;(any) and wall
    of fire. He can use feeblemind once per day.</p>

    <p class="p1">Orcus radiates a 60-foot-radius aura of fear&nbsp;(as the
    spell). A creature in the area must&nbsp;succeed at a saving throw or be
    affected as&nbsp;though by a fear spell.</p>

    <p class="p1">Three times per day, Orcus can summon one balor, 1d3
    nalfeshnees, or&nbsp;1d4 mariliths. As their prince, Orcus can&nbsp;summon
    up to 100 HD of any type of&nbsp;undead each day.</p>

    <p class="p1"><strong>Wand of Orcus:</strong> Mighty Orcus wields
    a&nbsp;huge, black, skull-tipped rod that functions&nbsp;as a +3 heavy mace.
    It slays any living creature it touches if the target fails a
    saving&nbsp;throw. Further, the wand has the following&nbsp;magical powers:
    3/day&mdash;animate dead,&nbsp;darkness, fear; 2/day&mdash;unholy word.
    Orcus&nbsp;occasionally allows his wand to pass into&nbsp;the Material
    Plane, usually into the hands&nbsp;of one of his servants.</p>

    <hr>

    <p class="p1"><em>Demons are creatures of the lower planes of existence, but
    they are occasionally encountered in places where they have been enslaved to
    serve as guardians by powerful Magic-Users or evil Clerics. The more
    intelligent varieties might also be interrupted while carrying out plots of
    their own. There is no meaningful game distinction between demons and
    devils; all are creatures of the lower planes.</em></p>
