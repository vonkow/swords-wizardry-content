  alignment: 'N'
  description: >-
    <p class="p1">Stone golems are massive stone statues&nbsp;animated by very
    powerful magics (much&nbsp;more than just animate object, in
    other&nbsp;words). They are slowed by fire spells,&nbsp;damaged by
    rock-to-mud spells, and healed&nbsp;by the reverse. Spells that affect rock,
    and&nbsp;fire spells, are the only ones that affect stone&nbsp;golems. They
    can be hit only by +2 or&nbsp;better weapons.</p>

    <hr>

    <p class="p1"><em>Golems are man-shaped creatures built&nbsp;to serve their
    masters, usually powerful&nbsp;wizards or high priests. They are often
    used&nbsp;as guardians. Golems cannot be hit with&nbsp;non-magical weapons,
    and are immune to&nbsp;the sorts of spells used to create them
    (iron&nbsp;golems being immune to fire, for instance).&nbsp;You can find the
    details in the specific monster descriptions.</em></p>
