  alignment: 'N'
  description: >-
    <p class="p1">A fully-grown sea serpent is approximately&nbsp;50 feet in
    length and swallows a person&nbsp;whole on any attack roll in which the
    die&nbsp;rolled is 4 or more over the required number, and always if the die
    roll is a 20. Swallowed victims will be dead within an hour&nbsp;and fully
    digested within one day. Some sea&nbsp;serpents are also venomous, in which
    case&nbsp;the CL/XP is 19/4,100.</p>
