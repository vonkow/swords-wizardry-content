  alignment: C
  description: >-
    <p class="p1">Shadows may or may not be undead creatures; they are immune to
    sleep and charm,&nbsp;but the Referee may decide whether they&nbsp;are
    undead creatures subject to turning&nbsp;or whether they are some horrible
    &ldquo;other&rdquo; thing: a manifestation, perhaps, or a&nbsp;creature from
    another dimension (or gaps&nbsp;in the dimensions). Shadows are dark
    and&nbsp;resemble actual shadows, though they may&nbsp;be even darker in
    coloration. They are not&nbsp;corporeal and can be harmed only
    with&nbsp;magical weapons or by spells. Their chill&nbsp;touch drains one
    point of Strength with a&nbsp;successful hit, and if a victim is brought
    to&nbsp;a Strength attribute of 0, he or she transforms into a new shadow.
    If the person&nbsp;does not come to such a dark ending, then&nbsp;Strength
    points return after 90 minutes (9&nbsp;turns).</p>
