  alignment: C
  description: >-
    <p class="p1">Trolls are as tall as ogres, and just as strong.&nbsp;Unlike
    ogres, however, they attack with&nbsp;claws and teeth instead of weapons.
    Trolls&nbsp;regenerate, which is to say that any damage&nbsp;inflicted upon
    them heals within minutes&nbsp;(3 hit points per round). The only way
    to&nbsp;utterly kill a troll is to submerge it in acid or&nbsp;burn it.
    Trolls can even regrow lopped-off&nbsp;heads and limbs.</p>
