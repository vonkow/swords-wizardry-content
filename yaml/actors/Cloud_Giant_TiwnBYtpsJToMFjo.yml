  alignment: Usually C
  description: >-
    <p class="p1">Cloud giants are cunning beasts, often living in cloud-castles
    in the sky (hence their&nbsp;name). They throw rocks for 6d6 hit
    points&nbsp;of damage. Cloud giants are famous for&nbsp;their ability to
    smell out food, enemies, and&nbsp;Englishmen.</p>

    <hr>

    <p class="p1"><em>Giants are a staple of fantasy gaming, huge&nbsp;and
    dangerous creatures that often have a&nbsp;taste for human flesh. Most are
    not particularly intelligent.</em></p>
