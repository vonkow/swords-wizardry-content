  alignment: C
  description: >-
    <p class="p1"><em>Spell-like abilities: at will</em>&mdash;charm person,
    levitate,&nbsp;polymorph self.</p>

    <p class="p1">Mariliths appear as a cruel-eyed beautiful&nbsp;woman with a
    six-armed torso, but the&nbsp;lower body of a huge constrictor
    snake.&nbsp;They can wield weapons in all six arms&nbsp;at once, and the
    tail, if it hits, constricts&nbsp;for automatic damage after the
    initial&nbsp;hit. Mariliths are among the most feared&nbsp;of demons &mdash;
    as much, even, as the mighty&nbsp;baalrochs. They can, at will, cast
    charm&nbsp;person, levitate, and polymorph self, and&nbsp;are 80% resistant
    to magic. Fire does not&nbsp;affect them.</p>

    <p class="p1">They have a 50% chance of success when&nbsp;attempting to gate
    in allies; if the attempt&nbsp;succeeds, roll 1d12 to determine the
    result.&nbsp;(1&ndash;3) First-category, (4&ndash;6)
    Second-category,&nbsp;(7&ndash;8) Third-category, (9&ndash;10)
    Fourth-category, (11) Sixth-category, (12) a demon lord or&nbsp;demon
    prince.</p>

    <hr>

    <p class="p1"><em>Demons are creatures of the lower planes of existence, but
    they are occasionally encountered in places where they have been enslaved to
    serve as guardians by powerful Magic-Users or evil Clerics. The more
    intelligent varieties might also be interrupted while carrying out plots of
    their own. There is no meaningful game distinction between demons and
    devils; all are creatures of the lower planes.</em></p>
