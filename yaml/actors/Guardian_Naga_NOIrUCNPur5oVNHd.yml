  alignment: L
  description: >-
    <p class="p1">The largest and noblest of the naga, guardian nagas are from
    20 to 25 feet in length.&nbsp;They do not necessarily have a
    humanlike&nbsp;head, but some characteristic (a flowing&nbsp;mane of hair,
    for instance) will immediately&nbsp;set their appearance apart from
    normal&nbsp;serpents. They can bite or spit with lethal&nbsp;poison, and if
    they hit with their coils they&nbsp;automatically cause 1d8 points of
    constriction damage per round thereafter. Guardian nagas cast clerical
    spells (2/2/1/1). A&nbsp;sample selection of spells for a guardian&nbsp;naga
    might include: level 1: <em>Cure light wounds </em>x2; level 2: <em>hold
    person</em>, <em>silence 15-foot radius</em>;&nbsp;level 3: <em>cure
    disease</em>; level 4: <em>cure serious wounds</em>.</p>

    <hr>

    <p class="p1"><em>&ldquo;Naga&rdquo; is the Sanskrit word for dragon
    or&nbsp;snake. In mythology, the naga are benevolent and very powerful,
    equivalent to Asian&nbsp;dragons. The nagas portrayed here are&nbsp;more
    serpentine and less powerful; all have&nbsp;the body of a snake, although
    the head is&nbsp;not necessarily that of a serpent. All kinds&nbsp;of
    interesting abilities may be found in&nbsp;&ldquo;unusual&rdquo; nagas
    designed by the Referee,&nbsp;from breathing fire to moving in and out
    of&nbsp;strange planes of existence.</em></p>
