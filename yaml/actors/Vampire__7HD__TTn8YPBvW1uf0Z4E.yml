  alignment: C
  description: >-
    <p class="p1">Vampires are some of the most powerful&nbsp;of undead
    creatures. They can be hit only&nbsp;with magic weapons, and when
    &ldquo;killed&rdquo; in&nbsp;this way, they turn into a gaseous form
    and&nbsp;return to their coffins.</p>

    <p class="p1">They regenerate at a rate of 3 hit points per&nbsp;round, can
    turn into a gaseous form or into&nbsp;a giant bat at will, and can summon a
    horde&nbsp;of rats/bats or 3d6 wolves out of the night.&nbsp;Looking into a
    vampire&rsquo;s eyes necessitates&nbsp;a saving throw at &ndash;2 or the
    character is&nbsp;charmed (per the charm person spell).
    Most&nbsp;terrifyingly, a vampire&rsquo;s bite drains 2 levels&nbsp;from the
    victim.</p>

    <p class="p1">Fortunately, vampires have some weaknesses. They can be killed
    (though these are the&nbsp;only known methods) by immersing them
    in&nbsp;running water, exposing them to sunlight,&nbsp;or by driving a
    wooden stake through the&nbsp;heart. They retreat from the smell of
    garlic,&nbsp;the sight of a mirror, or the sight of
    &ldquo;good&rdquo;&nbsp;holy symbols. Any human killed by a vampire becomes
    a vampire under the control&nbsp;of its creator.</p>

    <p class="p1">This description will be recognized easily&nbsp;as the
    &ldquo;Dracula&rdquo; type of vampire. Many&nbsp;other possibilities for
    vampires exist in&nbsp;folklore: Chinese vampires, for instance,
    and&nbsp;blood-drinkers more feral than intelligent.&nbsp;Plus, other
    cultural templates with different&nbsp;attributes could be created; how
    about an&nbsp;ancient Egyptian mummified vampire, or an&nbsp;Aztec
    vampire?</p>
