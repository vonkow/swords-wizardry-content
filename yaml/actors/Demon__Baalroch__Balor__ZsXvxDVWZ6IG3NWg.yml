  alignment: C
  description: >-
    <p class="p1">The baalroch&rsquo;s name means, roughly, the Bull of Baal:
    the Baal-aurochs. (The aurochs was a bull that stood 12 feet tall at the
    shoulder, and Baal is an ancient and evil pagan deity.) These powerful
    demons somewhat resemble vast minotaurs with great, spreading bat-wings;
    they burn with the fires of hell and are wreathed in flame. The spells of
    casters below 6th level do not affect them, and against higher-level spell
    casters, they are still 75% immune to all spells.</p>

    <p class="p1">In combat, a baalroch uses whip and&nbsp;sword. The whip can
    be used to reach great&nbsp;distances; on a successful hit, the victim
    is&nbsp;pulled close to the baalroch and burned&nbsp;by the fires of the
    demon&rsquo;s body (3d6 hit&nbsp;points). Baalrochs are sometimes
    referred&nbsp;to in ancient texts as balor or baalor,&nbsp;which may be the
    name of a single demon&nbsp;rather than a term for all of them. A baalroch
    could be forced or tricked into the&nbsp;service of a powerful wizard, but
    the risk&nbsp;would be immense.</p>

    <p class="p1">Baalrochs may attempt to gate in an ally&nbsp;with a 70%
    chance of success. The responding demon will usually be a
    third-category&nbsp;demon (01&ndash;80 on 1d100) but an unusually successful
    summoning might call a&nbsp;fourth-category demon (81&ndash;00 on
    1d100).</p>

    <hr>

    <p class="p1"><em>Demons are creatures of the lower planes&nbsp;of
    existence, but they are occasionally&nbsp;encountered in places where they
    have been&nbsp;enslaved to serve as guardians by powerful&nbsp;Magic-Users
    or evil Clerics. The more intelligent varieties might also be
    interrupted&nbsp;while carrying out plots of their own. There&nbsp;is no
    meaningful game distinction between&nbsp;demons and devils; all are
    creatures of the&nbsp;lower planes.</em></p>
  cl: 17
