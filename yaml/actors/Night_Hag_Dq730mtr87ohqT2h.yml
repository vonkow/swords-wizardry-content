  alignment: C
  description: >-
    <p class="p1">Night hags come from beyond the material&nbsp;plane: perhaps
    from the realms of dream,&nbsp;perhaps from the demonic pits of
    the&nbsp;underworlds. These creatures prey upon&nbsp;the souls of those who
    are evil/chaotic: they&nbsp;can cause enchanted sleep once against
    such&nbsp;individuals (saving throw, affects up to 12<span class="s1">th
    </span>level), or visit the victim&rsquo;s dreams nightly (no&nbsp;saving
    throw) to leech away a point of constitution per night until the attribute
    reaches&nbsp;0 and the hag can steal away the soul. In&nbsp;combat, night
    hags can magically weaken&nbsp;an opponent to half normal strength
    (saving&nbsp;throw) three times per day; additionally, they&nbsp;can use a
    spell that automatically inflicts 2d8&nbsp;points of damage against a single
    opponent.&nbsp;Both of these abilities have a range of 100ft.&nbsp;A hag can
    also also become ethereal and&nbsp;incorporeal at will, summon a demon
    ally&nbsp;once per day (with only a 50% chance of&nbsp;success), and cannot
    be hit by weapons with&nbsp;a magical bonus of +2 or less. They
    are&nbsp;highly resistant to magic, as well.</p>
