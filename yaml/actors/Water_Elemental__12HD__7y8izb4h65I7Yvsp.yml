  alignment: 'N'
  description: >-
    <p class="p1">Water elementals cannot move more than&nbsp;60 feet from a
    large body of water, and their&nbsp;damage is reduced by 1d6 if the
    opponent&nbsp;is not standing in water (or swimming,&nbsp;etc.). These
    powerful beings can overturn&nbsp;small boats and can overturn a ship if
    given&nbsp;1d4+4 rounds to work at it. On water, they&nbsp;can attack ships,
    battering them to pieces&nbsp;within 1 hour if not prevented or
    distracted.</p>

    <hr>

    <p class="p1"><em>Elementals are living manifestations of&nbsp;the basic
    forms of matter: air, earth, fire,&nbsp;and water. They are usually
    summoned&nbsp;from their native planes of existence to do&nbsp;the bidding
    of a powerful wizard. These&nbsp;beings can also be &ldquo;chained&rdquo;
    within objects&nbsp;or structures to give the objects
    magical&nbsp;properties. Elementals are barely intelligent&nbsp;at all, but
    they are as powerful as the forces&nbsp;of nature that they actually
    are.</em></p>
