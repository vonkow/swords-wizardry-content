  alignment: 'N'
  description: >-
    <p class="p1">After a giant squid hits with a tentacle,
    it&nbsp;automatically does 1d6 points of damage&nbsp;per round, instead of
    the initial 1d3. Also,&nbsp;there is a 25% chance that the
    tentacle&nbsp;&ldquo;hit&rdquo; pinions one of the victim&rsquo;s limbs
    (roll&nbsp;randomly for left/right arms and legs to see&nbsp;which is
    immobilized). A giant squid can jet&nbsp;water out to achieve a movement
    rate of up&nbsp;to 27 and can also release a huge cloud of&nbsp;ink to
    obscure its location. If a giant squid&nbsp;wraps its tentacles around a
    ship, the ship&nbsp;is crushed in 10 rounds, taking damage&nbsp;throughout
    that time.</p>
