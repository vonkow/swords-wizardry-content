  alignment: 'N'
  description: >-
    <p class="p1">Giant fish can range from something barely&nbsp;larger than a
    shark to something as large as&nbsp;a whale. In general, these creatures
    will be&nbsp;at least 11 feet long and have 1HD per 2&nbsp;feet of length.
    Thus, if rolling randomly for&nbsp;a giant fish, roll 1d10+10 feet to
    determine&nbsp;the length, and the hit dice will be half that&nbsp;number.
    If the roll is a &ldquo;10&rdquo; (i.e., the fish&nbsp;would be 20 feet
    long), then it is a REALLY&nbsp;giant fish; roll 1d20 for additional feet
    in&nbsp;length. Thus, the maximum size for a giant&nbsp;fish is 40 feet, and
    for some unknown reason&nbsp;giant fish never seem to be exactly 20 feet
    in&nbsp;length; a matter for philosophers to puzzle&nbsp;upon. The truly
    giant fish can most likely&nbsp;swallow people whole on a natural roll
    of&nbsp;18&ndash;20. Use the rules for creating monsters&nbsp;to determine
    the saving throws and experience point values of the varying sizes
    of&nbsp;giant fish. Giant fish might be intelligent&nbsp;(5% chance), in
    which case they might have&nbsp;an alignment other than Neutrality.</p>
