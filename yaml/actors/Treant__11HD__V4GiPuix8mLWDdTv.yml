  alignment: L
  description: >-
    <p class="p1">Treants are tree-like protectors and &ldquo;shepherds&rdquo;
    of forest trees. Depending upon&nbsp;their size, they have different hit
    dice and&nbsp;do different amounts of damage: Treants of&nbsp;7 to 8 hit
    dice inflict 2d6 points of damage with each strike of their
    branch-like&nbsp;hands; treants of 9&ndash;10 hit dice inflict
    3d6&nbsp;points; and treants of 11&ndash;12 hit dice inflict&nbsp;4d6
    points. All treants can &ldquo;wake&rdquo; trees&nbsp;within 60 feet,
    allowing them to walk at a&nbsp;rate of 3, and possibly to attack. (No
    more&nbsp;than two trees at a time can be awake at the&nbsp;behest of a
    single treant.)</p>
