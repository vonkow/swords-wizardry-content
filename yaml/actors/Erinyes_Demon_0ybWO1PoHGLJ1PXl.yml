  alignment: C
  description: >-
    <p class="p1"><em>Spell-like abilities: at will</em>&mdash;detect
    invisibility, locate&nbsp;object.</p>

    <p class="p1">The erinyes, the &ldquo;Furies&rdquo; of Ancient
    Greek&nbsp;mythology, are female demons who pursue&nbsp;those guilty of
    crimes against the order of&nbsp;the gods. Their appearance is so terrible
    as&nbsp;to cause fear (saving throw). They are able&nbsp;to see invisible
    things and locate objects at&nbsp;will, so it is impossible to hide from
    them.&nbsp;Each fury carries a whip which, if it hits,&nbsp;entangles the
    victim (saving throw) until the&nbsp;Fury releases it. The Furies are immune
    to&nbsp;fire and cold, and have a magic resistance&nbsp;of 25%. The blade of
    a Fury&rsquo;s sword causes&nbsp;paralysis (saving throw).</p>

    <hr>

    <p class="p1"><em>Demons are creatures of the lower planes of existence, but
    they are occasionally encountered in places where they have been enslaved to
    serve as guardians by powerful Magic-Users or evil Clerics. The more
    intelligent varieties might also be interrupted while carrying out plots of
    their own. There is no meaningful game distinction between demons and
    devils; all are creatures of the lower planes.</em></p>
