  alignment: C
  description: >-
    <p class="p1">Yetis are the &ldquo;Bigfoot&rdquo; creatures of
    the&nbsp;arctic and the high mountains. If a yeti&nbsp;strikes the same
    opponent with both fists, it&nbsp;bear-hugs for an additional 2d8 points
    of&nbsp;damage. Anyone caught in the yeti&rsquo;s arms&nbsp;like this must
    make a saving throw or be&nbsp;paralyzed with fear for 1d3 rounds,
    during&nbsp;which time the yeti hits automatically. Yetis&nbsp;are very
    intelligent and can be quite malevolent. They are immune to normal
    and&nbsp;magical cold.</p>
