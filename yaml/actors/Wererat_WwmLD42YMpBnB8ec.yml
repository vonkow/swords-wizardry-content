  alignment: C
  description: >-
    <p class="p1">Wererats are often found in cities, lurking in shadowy
    alleyways. Wererats can control rats and are extremely stealthy, surprising
    opponents on 1&ndash;4 on a d6.</p>

    <hr>

    <p class="p1"><em>Lycanthropes are were-creatures, particularly those in
    whom the disease lycanthropy permits assumption of a hybrid form of the
    human and animal. They cannot be hit by normal weapons: only silver and
    magical weapons affect them. If anyone is attacked and brought below 50% hit
    points by a lycanthrope, the person becomes a lycanthrope himself.</em></p>
