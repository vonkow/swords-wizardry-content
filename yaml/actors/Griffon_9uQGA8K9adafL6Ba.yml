  alignment: 'N'
  description: >-
    <p class="p1">Griffons have the body of a lion, with the&nbsp;head,
    foreclaws, and wings of an eagle.&nbsp;These creatures can be tamed and
    ridden as&nbsp;mounts. They usually nest in high mountain aeries where they
    lay their eggs and&nbsp;hunt their prey. Because the fledglings can&nbsp;be
    tamed, young griffons and griffon eggs&nbsp;command a very high price in the
    marketplaces of the great cities or to noble lords&nbsp;and wizards.</p>
