  alignment: C
  description: >-
    <p class="p1">Spectres are wraith-like undead creatures&nbsp;without
    corporeal bodies. When a spectre hits an opponent, with either hand
    or&nbsp;weapon, the touch drains two levels from&nbsp;the victim. Only
    magical weapons can&nbsp;damage a spectre. In some cases,
    these&nbsp;terrifying creatures may be mounted upon&nbsp;living beasts, if
    the beasts have been trained&nbsp;to tolerate proximity to the undead.
    Any&nbsp;being killed (or drained below level 0) by&nbsp;a spectre becomes a
    spectre as well, a pitiful&nbsp;thrall to its creator.</p>
