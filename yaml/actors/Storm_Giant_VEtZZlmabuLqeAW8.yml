  alignment: Any
  description: >-
    <p class="p1">Storm giants are the largest of giants, the&nbsp;most
    intelligent, the most magical, and the&nbsp;most likely to talk with humans
    rather than&nbsp;simply devour them. Storm giants can live&nbsp;in
    underwater sea-castles as well as on the&nbsp;heights of mountains. They
    throw boulders&nbsp;for 7d6 points of damage and have the power to control
    weather (as per the spell).</p>

    <hr>

    <p class="p1"><em>Giants are a staple of fantasy gaming, huge&nbsp;and
    dangerous creatures that often have a&nbsp;taste for human flesh. Most are
    not particularly intelligent.</em></p>
