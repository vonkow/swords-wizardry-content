  alignment: C
  description: >-
    <p class="p1"><em>Spell-like abilities: at will</em>&mdash;darkness 15ft
    radius.</p>

    <p class="p1">These demons are vulture-headed, with&nbsp;feathered humanoid
    bodies, and huge&nbsp;dark-feathered wings. All can create darkness in a
    radius of five feet and are immune&nbsp;to fire. They use their wings to
    bring their&nbsp;arms and legs into combat, along with their&nbsp;beaked
    bite. Vrock demons are quite stupid,&nbsp;though like most demons they
    consider&nbsp;themselves to be tremendously intelligent.&nbsp;</p>

    <p class="p1">A vrock has a 10% chance to gate another first-category demon
    to its assistance.</p>

    <hr>

    <p class="p1"><em>Demons are creatures of the lower planes of existence, but
    they are occasionally encountered in places where they have been enslaved to
    serve as guardians by powerful Magic-Users or evil Clerics. The more
    intelligent varieties might also be interrupted while carrying out plots of
    their own. There is no meaningful game distinction between demons and
    devils; all are creatures of the lower planes.</em></p>
