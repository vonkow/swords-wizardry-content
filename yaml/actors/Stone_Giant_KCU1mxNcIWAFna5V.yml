  description: >-
    <p class="p1">Stone giants dwell in caves, isolated in the&nbsp;mountain
    fastnesses. They throw rocks for&nbsp;3d6 points of damage, and can be
    quite&nbsp;crafty in setting up ambushes in their native&nbsp;mountains.
    Travelers who wander into the&nbsp;territory of stone giants seldom
    return.</p>

    <hr>

    <p class="p1"><em>Giants are a staple of fantasy gaming, huge&nbsp;and
    dangerous creatures that often have a&nbsp;taste for human flesh. Most are
    not particularly intelligent.</em></p>
