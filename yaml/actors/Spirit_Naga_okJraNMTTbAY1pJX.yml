  alignment: C
  description: >-
    <p class="p1">Spirit nagas are malicious, evil creatures.&nbsp;Their gaze
    has the effect of a charm person&nbsp;spell, their bite is poison, and they
    cast&nbsp;both Magic-User spells (4/2/1) and Cleric&nbsp;spells (2/1). A
    sample spell selection for a&nbsp;spirit naga might be: Magic-User
    spells:&nbsp;1st&mdash;charm person (x2), magic missile,&nbsp;sleep;
    2nd&mdash;mirror image, web; 3rd&mdash;protection from normal missiles.
    Cleric spells:&nbsp;1st&mdash;cure light wounds (x2);
    2nd&mdash;silence&nbsp;15-foot radius. Such nagas are from 10 to&nbsp;20
    feet in length, and have a human head.</p>

    <hr>

    <p class="p1"><em>&ldquo;Naga&rdquo; is the Sanskrit word for dragon
    or&nbsp;snake. In mythology, the naga are benevolent and very powerful,
    equivalent to Asian&nbsp;dragons. The nagas portrayed here are&nbsp;more
    serpentine and less powerful; all have&nbsp;the body of a snake, although
    the head is&nbsp;not necessarily that of a serpent. All kinds&nbsp;of
    interesting abilities may be found in&nbsp;&ldquo;unusual&rdquo; nagas
    designed by the Referee,&nbsp;from breathing fire to moving in and out
    of&nbsp;strange planes of existence.</em></p>
