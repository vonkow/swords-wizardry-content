  alignment: C
  description: >-
    <p class="p1"><em>Spell-like abilities: at will</em>&mdash;dispel magic,
    fear, polymorph self; 1/day&mdash;symbol of discord.</p>

    <p class="p1">Nalfeshnee demons have the body of an&nbsp;enormous gorilla,
    the head of a boar, and&nbsp;cloven hooves. These massive, brutish demons
    are actually quite intelligent, despite&nbsp;their appearance, an
    incongruity that has&nbsp;deceived and doomed many who would attempt to
    control or enslave them. The very&nbsp;size of a nalfeshnee prevents them
    from&nbsp;being particularly agile flyers, though they&nbsp;do have wings.
    Nalfeshnee are incredibly&nbsp;powerful (+2 to hit) and have various demonic
    powers in addition to being immune&nbsp;to fire. At will, they can cast
    fear, dispel&nbsp;magic, and polymorph self. They can also&nbsp;create a
    symbol of discord once per day.&nbsp;A nalfeshnee demon has a 60% chance
    to&nbsp;gate in an ally (roll 1d6 to determine which&nbsp;category of demon
    responds).</p>

    <hr>

    <p class="p1"><em>Demons are creatures of the lower planes of existence, but
    they are occasionally encountered in places where they have been enslaved to
    serve as guardians by powerful Magic-Users or evil Clerics. The more
    intelligent varieties might also be interrupted while carrying out plots of
    their own. There is no meaningful game distinction between demons and
    devils; all are creatures of the lower planes.</em></p>
