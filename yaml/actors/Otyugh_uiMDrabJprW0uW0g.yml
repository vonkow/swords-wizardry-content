  alignment: 'N'
  description: >-
    <p class="p1">Otyughs live underground, hiding in piles&nbsp;of refuse, for
    they are scavengers. These&nbsp;bizarre creatures are slightly larger than
    a&nbsp;human, a mass of flesh mounted on three&nbsp;squat, elephant-like
    legs. The otyugh has a&nbsp;sensory-organ stalk, and two rough, bone-ridged
    tentacles used for attacking enemies.&nbsp;Anyone bitten by an
    otyugh&rsquo;s mouth has a&nbsp;90% chance of contracting a fatal
    disease&nbsp;(death in 3d6 days unless cured). Although&nbsp;they are
    relatively stupid, otyughs use rudimentary telepathy to communicate
    with&nbsp;each other (and other telepathic beings, if&nbsp;they are
    encountered).</p>
