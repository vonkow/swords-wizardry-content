  alignment: C
  description: >-
    <p class="p1"><em>Spell-like abilities: at will</em>&mdash;darkness 15ft
    radius,&nbsp;fear, levitate, polymorph self.</p>

    <p class="p1">The third-category demons, glabrezu, are massive and horrible,
    standing 10 feet high or more. They have goat horns and a humanoid shape,
    but no wings. Four arms sprout from the torso: two huge arms with great
    crab-pincers, and two much shorter arms with claws. Glabrezu can cause
    darkness in a 10-foot radius, are immune to fire, can cause fear at will,
    can levitate at will, can polymorph themselves, and are 60% resistant to
    magic.</p>

    <p class="p1">These demons have a 30% chance to gate in&nbsp;an ally (roll
    1d4 to determine the category&nbsp;of demon that responds).</p>

    <hr>

    <p class="p1"><em>Demons are creatures of the lower planes of existence, but
    they are occasionally encountered in places where they have been enslaved to
    serve as guardians by powerful Magic-Users or evil Clerics. The more
    intelligent varieties might also be interrupted while carrying out plots of
    their own. There is no meaningful game distinction between demons and
    devils; all are creatures of the lower planes.</em></p>
