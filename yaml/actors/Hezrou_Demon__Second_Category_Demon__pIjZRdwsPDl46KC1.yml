  alignment: C
  description: >-
    <p class="p1"><em>Spell-like abilities: at wil</em>l&mdash;darkness 15ft
    radius,&nbsp;detect invisibility, fear.</p>

    <p class="p1">Toad-like demons with bat wings, the hezrou have magic
    resistance of 50%. At will, they can cause fear (per the spell), detect
    invisibility (per the spell), and cause darkness in a 15-foot radius. They
    are immune to fire.</p>

    <p class="p1">Hezrou have a 20% chance to succeed&nbsp;at summoning another
    second-category&nbsp;demon to their aid.</p>

    <hr>

    <p class="p1"><em>Demons are creatures of the lower planes of existence, but
    they are occasionally encountered in places where they have been enslaved to
    serve as guardians by powerful Magic-Users or evil Clerics. The more
    intelligent varieties might also be interrupted while carrying out plots of
    their own. There is no meaningful game distinction between demons and
    devils; all are creatures of the lower planes.</em></p>
