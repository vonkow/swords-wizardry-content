    successfully, the victim must&nbsp;make a saving throw or become
    paralyzed&nbsp;(6 turns) for the cube to devour. Most&nbsp;gelatinous cubes
    contain various metallic&nbsp;treasures or gems that they have
    engulfed&nbsp;but not yet digested.</p>
