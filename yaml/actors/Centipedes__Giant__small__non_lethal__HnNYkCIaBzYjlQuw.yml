  alignment: 'N'
  description: >-
    <p class="p1">The non-lethal variety of giant centipede&nbsp;has a painful
    bite but its poison is only&nbsp;crippling, not lethal. Failing a saving
    throw&nbsp;(at a +4 bonus) against the poison of this&nbsp;centipede causes
    1d4 rounds of crippling&nbsp;pain (the victim is helpless, as when
    asleep).&nbsp;Additionally, the limb (roll 1d4) is temporarily crippled
    (treat as a disease) for 2d4&nbsp;days. A crippled leg reduces movement
    by&nbsp;50%; a crippled shield arm cannot wield&nbsp;a weapon or shield; a
    crippled sword arm&nbsp;attacks at &ndash;4. A second bite on a leg reduces
    movement to one quarter normal, and a&nbsp;third bite to the legs reduces
    movement to 1&nbsp;foot per minute (prone, dragging oneself by&nbsp;the
    arms).</p>
