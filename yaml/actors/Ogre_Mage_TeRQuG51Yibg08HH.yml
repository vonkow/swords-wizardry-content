  alignment: C
  description: >-
    <p class="p1"><em>Spell-like Abilities: at will</em>&mdash;darkness 15ft
    radius,&nbsp;invisibility, polymorph self; 1/day&mdash;charm&nbsp;person,
    cone of frost (60ft range, 20ft diameter blast, 8d6 damage to all, save for
    half),&nbsp;sleep.</p>

    <p class="p1">The ogre mage is an ogre with magic&nbsp;powers, based on
    Japanese legend. An ogre&nbsp;mage can fly, turn invisible (per the
    spell),&nbsp;create a 10-foot-radius circle of magical&nbsp;darkness, change
    into human form, cast&nbsp;sleep and charm person once per day,
    and&nbsp;cast a cone of frost with a range of 60 feet&nbsp;to a base of 30
    feet, causing 8d6 damage&nbsp;to any caught within (saving throw applies).
    Western folklore also contains many&nbsp;examples of shape-shifting, magical
    ogres&nbsp;(the most famous example being the one&nbsp;in Puss-in-Boots), so
    there might be many&nbsp;different interpretations of magical
    ogres&nbsp;whether or not they are called &ldquo;ogre mage.&rdquo;</p>
