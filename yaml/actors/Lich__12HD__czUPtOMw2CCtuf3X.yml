  alignment: C
  description: >-
    <p class="p1">Liches are the undead remnants of wizards,&nbsp;either made
    undead by their own deliberate&nbsp;acts during life, or as the result of
    other&nbsp;magical forces (possibly including their own&nbsp;magics gone
    awry). A lich has the same&nbsp;number of hit dice as the original
    Magic-User and the same spell-casting powers. A&nbsp;lich&rsquo;s touch
    causes paralysis with no saving&nbsp;throw, and the very sight of one of
    these&nbsp;dread creatures causes any being of 4 HD&nbsp;or below to flee in
    abject terror. Liches are&nbsp;highly intelligent and totally malign.</p>
