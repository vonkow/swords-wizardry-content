  alignment: C
  description: >-
    <p class="p1">Bandits are roving groups of thieves, sometimes organized into
    small armies led by&nbsp;more powerful bandit chiefs and captains&nbsp;with
    higher hit dice. For every 30 bandits&nbsp;in such a group, there will be an
    additional&nbsp;4th level fighter. For every 50 bandits, there&nbsp;will be
    an additional 5th level fighter. For&nbsp;every 100 bandits, there will be a
    fighter&nbsp;of 8th level. Bands of 200 or more have&nbsp;a 50% chance to be
    accompanied by a&nbsp;magic-user of 10th level, and a 50% chance&nbsp;to be
    accompanied by a (Chaotic) cleric of&nbsp;8th level.</p>

    <hr>

    <p class="p1"><em>Humans are such a versatile ancestry that&nbsp;any number
    of &ldquo;monsters&rdquo; and NPCs can&nbsp;be made from them. Berserker
    warriors,&nbsp;tribesmen, cavemen, princesses, evil high&nbsp;priests,
    captains of the guard, foot-soldiers, and tavern-keepers are all
    different&nbsp;human &ldquo;monsters.&rdquo; Don&rsquo;t try to build
    your&nbsp;non-player characters according to the rules&nbsp;for player
    characters. Just make up their&nbsp;stats and abilities as you see
    fit.</em></p>
