  alignment: C
  description: >-
    <p class="p1">Liches are the undead remnants of wizards, either made undead
    by their own deliberate acts during life, or as the result of other magical
    forces (possibly including their own magics gone awry). A lich has the same
    number of hit dice as the original Magic-User and the same spell-casting
    powers. A lich&rsquo;s touch causes paralysis with no saving throw, and the
    very sight of one of these dread creatures causes any being of 4 HD or below
    to flee in abject terror. Liches are highly intelligent and totally
    malign.</p>
