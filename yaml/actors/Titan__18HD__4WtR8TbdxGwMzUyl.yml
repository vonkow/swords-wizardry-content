  alignment: Any
  description: >-
    <p class="p1">Titans are mythological creatures almost as&nbsp;powerful as
    gods. A titan has 2 Magic-User&nbsp;spells of each spell level from
    1st-level spells&nbsp;to 7th-level spells, and 2 Cleric spells of&nbsp;each
    spell level from 1st to 7th. The Referee&nbsp;might choose to substitute
    other magical&nbsp;abilities for spells &mdash; these creatures
    vary&nbsp;considerably in powers and personalities&nbsp;from one to the
    next.</p>

    <p class="p1">One possible spell list for a titan might&nbsp;include the
    following Magic-User and Cleric&nbsp;spells:&nbsp;</p>

    <p class="p1">Magic-User: 1st&mdash;charm person, sleep;
    2nd&mdash;invisibility, mirror image; 3rd&mdash;fireball, fly;
    4th&mdash;confusion, polymorph other ,; 5th&mdash;conjuration of elementals,
    feeblemind; 6th&mdash;anti-magic shell, stone to flesh; 7th&mdash;limited
    wish, power word stun.</p>

    <p class="p1">Cleric: 1st&mdash;light, protection from
    evil;&nbsp;2nd&mdash;hold person, speak with animals;&nbsp;3rd&mdash;cure
    disease, dispel magic; 4th&mdash;cure&nbsp;serious wounds, neutralize
    poison; 5th&mdash;finger of death, quest; 6th&mdash;blade barrier,
    word&nbsp;of recall; 7th&mdash;earthquake, resurrection.</p>
