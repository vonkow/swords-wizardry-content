  alignment: C
  description: >-
    <p class="p1">Will- o&rsquo;-the-wisps are phantom-like shapes&nbsp;of eerie
    light, creatures that live in dangerous places and try to lure travelers
    into&nbsp;quicksand, off the edges of cliffs, etc. They&nbsp;usually inhabit
    swamps or high moors. They&nbsp;can brighten or dim their own
    luminescence&nbsp;and change their shapes as well to appear&nbsp;as a group
    of lights, a wisp of light, or in&nbsp;the glowing wraith-like shape of a
    human&nbsp;(often female). They generally depart if the&nbsp;attempt to lead
    victims into danger fails, but&nbsp;if they are attacked, they defend
    themselves&nbsp;with violent shocks of lightning-like power.&nbsp;These
    creatures are intelligent and can be&nbsp;forced to reveal the location of
    their treasure&nbsp;hoards.</p>
