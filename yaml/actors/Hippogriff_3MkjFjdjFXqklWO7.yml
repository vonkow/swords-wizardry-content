  alignment: 'N'
  description: >-
    <p class="p1">The hippogriff is similar to a griffon, having&nbsp;the head,
    foreclaws, and wings of an eagle,&nbsp;but instead of the body of a lion, it
    has the&nbsp;body of a horse. The poem Orlando Furioso&nbsp;(written by the
    poet Ludovico Ariosto in&nbsp;1516) suggests that the hippogriff is
    the&nbsp;offspring of a griffon and a horse &mdash; but&nbsp;they are
    apparently an independent breed,&nbsp;for folkloric tradition holds that
    griffons&nbsp;frequently attack hippogriffs. Hippogriffs&nbsp;are not as
    hard to train as griffons &mdash; again,&nbsp;from Orlando Furioso (Canto
    IV): &ldquo;Drawn&nbsp;by enchantment from his distant lair, The&nbsp;wizard
    thought but how to tame the foal;&nbsp;And, in a month, instructed him to
    bear&nbsp;Saddle and bit, and gallop to the goal; And&nbsp;execute on earth
    or in mid air, All shifts&nbsp;of manege, course and caracole
    &hellip;&rdquo;</p>
