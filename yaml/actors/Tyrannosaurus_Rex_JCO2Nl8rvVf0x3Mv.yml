  alignment: 'N'
  description: >-
    <p class="p1">Tyrannosaurus is a deadly carnivorous&nbsp;dinosaur, walking
    on two legs and attacking with a massively powerful bite. When&nbsp;it bites
    prey, it grabs the victim in its jaws,&nbsp;shaking and chewing for 3d8
    points of&nbsp;automatic damage in subsequent rounds.&nbsp;It can inflict
    such damage even against&nbsp;opponents as large as a brontosaurus.
    Only&nbsp;creatures with shells, bone frills, or spines&nbsp;can avoid the
    horrendous tearing damage&nbsp;a tyrannosaur can inflict (e.g.,
    triceratops,&nbsp;stegosaurus, ankylosaurus).</p>
