  alignment: 'N'
  description: >-
    <p class="p1">Trapper beasts are large manta-like creatures resembling the
    stone floors of the&nbsp;subterranean areas where they live. When&nbsp;prey
    steps onto the trapper&rsquo;s body, it whips&nbsp;up its wings to enfold
    and smother its victims&nbsp;(to a maximum of four). Death occurs in
    7&nbsp;melee rounds. Cold does not damage them,&nbsp;and fire inflicts only
    half damage.</p>
