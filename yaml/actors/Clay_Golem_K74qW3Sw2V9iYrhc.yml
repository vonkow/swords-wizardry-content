  alignment: 'N'
  description: >-
    <p class="p1">The &ldquo;original&rdquo; golem of folklore, clay golems may
    be created by Clerics or powerful&nbsp;priests. They are massive clay
    statues of&nbsp;human beings, imbued with a rudimentary&nbsp;intelligence
    and the ability to move and&nbsp;follow their masters&rsquo; commands. For
    each&nbsp;round of combat, a clay golem has a 1%&nbsp;chance (cumulative) to
    go berserk, leaving its&nbsp;master&rsquo;s control and attacking enemies
    and&nbsp;allies alike. Clay golems are not damaged by&nbsp;slashing or
    piercing weapons. They are immune to all spells other than those
    affecting&nbsp;earth, and these have very diminished effects&nbsp;&mdash;
    with one exception. An earthquake spell&nbsp;may be used to utterly destroy
    a clay golem.</p>

    <hr>

    <p class="p1"><em>Golems are man-shaped creatures built&nbsp;to serve their
    masters, usually powerful&nbsp;wizards or high priests. They are often
    used&nbsp;as guardians. Golems cannot be hit with&nbsp;non-magical weapons,
    and are immune to&nbsp;the sorts of spells used to create them
    (iron&nbsp;golems being immune to fire, for instance).&nbsp;You can find the
    details in the specific monster descriptions.</em></p>
