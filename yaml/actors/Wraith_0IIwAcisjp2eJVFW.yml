  alignment: C
  description: >-
    <p class="p1">Wraiths are powerful wights that are immune to all non-magical
    weapons other than&nbsp;silver ones (which inflict only half
    damage).&nbsp;Arrows are particularly ineffective against&nbsp;them, for
    even magical and silver arrows&nbsp;inflict only one hit point of damage per
    hit.&nbsp;Wraiths can be found riding well-trained&nbsp;battle steeds or
    more unusual mounts that&nbsp;will tolerate their presence.</p>
