  alignment: 'N'
  description: >-
    <p class="p1">Nixies are weak water fey creatures. One in&nbsp;10 of them
    has the power to cast a powerful&nbsp;charm person (&ndash;2 penalty to
    saving throw)&nbsp;that causes the victim to walk into the water&nbsp;and
    join the nixies as their slave for a year.&nbsp;Casting dispel magic against
    the curse has&nbsp;only a 75% chance of success, and once the&nbsp;victim is
    actually in the water, the chance&nbsp;drops to 25%. Nixies are ordinarily
    friendly,&nbsp;but they are capricious.</p>
