  alignment: 'N'
  description: >-
    <p class="p1">A wyvern is a two-legged form of dragon.&nbsp;These creatures
    are smaller and less intelligent than true four-legged dragons, not&nbsp;to
    mention that they do not have a breath&nbsp;weapon. Each wyvern has a
    poisonous sting&nbsp;at the end of its tails. However, they are
    not&nbsp;coordinated enough to attack with both bite&nbsp;and sting in a
    single round. In any given&nbsp;round, a wyvern is 60% likely to use its
    tail,&nbsp;which can lash out to the creature&rsquo;s front&nbsp;even
    farther than its head can reach.</p>
