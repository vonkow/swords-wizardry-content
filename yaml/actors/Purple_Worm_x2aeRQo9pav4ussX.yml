  alignment: 'N'
  description: >-
    <p class="p1">Purple worms are massive annelids that&nbsp;grow 40 feet and
    more in length, and&nbsp;sometimes exceed 10 feet in width. They
    are&nbsp;subterranean, chewing tunnels in rock (or&nbsp;through sand in
    deserts, where they are a&nbsp;tan color). These beasts swallow their
    prey&nbsp;whole on a roll 4 higher than the needed&nbsp;number, or if the
    worm rolls double the&nbsp;number required to hit. They can
    swallow&nbsp;anything the size of a horse or smaller. In&nbsp;addition to
    the worm&rsquo;s dreaded bite, it has&nbsp;a poison stinger on its tail, the
    length of&nbsp;a sword and just as deadly even from the&nbsp;piercing wound
    it inflicts. In addition, the&nbsp;poison injected by the stinger is lethal
    if the&nbsp;victim fails a saving throw. What prey the&nbsp;purple worms
    once hunted with such natural weaponry (or perhaps still do, in
    deep&nbsp;places), must have been terrifying indeed.&nbsp;Aquatic versions
    of the purple worm might&nbsp;also exist.</p>
