  alignment: L (or N)
  description: >-
    <p class="p1">The example above is for a typical Elf;&nbsp;trained warriors
    would likely have the maximum 9 hit points. Obviously, Elves encountered in
    the course of a party&rsquo;s adventuring&nbsp;will have a variety of powers
    and different&nbsp;attributes. The Referee will assign such&nbsp;powers as
    he sees fit, in accordance with the&nbsp;way he envisions elves. They might
    be the&nbsp;woodland dwellers of Tolkien&rsquo;s The Hobbit,&nbsp;or the
    high elves of the Lord of the Rings,&nbsp;or might be the faerie folk of
    Irish legend.&nbsp;In any case, the Referee should not bother&nbsp;trying to
    fit an idea of &ldquo;advanced&rdquo; elves into&nbsp;the constraints of
    character classes &mdash; just&nbsp;assign their attributes to fit the
    concept.&nbsp;Non-player characters are not subject to the&nbsp;rules that
    govern building a player character; they are tools for good fantasy.</p>
