  alignment: 'N'
  description: >-
    <p class="p1">Grey ooze is almost identical in appearance to wet rock, but
    it is a slimy, formless&nbsp;substance that devours prey and
    carrion&nbsp;with its acidic secretions, and can lash out&nbsp;to strike
    enemies. Grey ooze is immune&nbsp;to spells, heat, and cold damage. Metal
    (but not stone or wood) must make a&nbsp;saving throw of 10 or higher vs.
    acid when&nbsp;exposed to grey ooze (even if the contact&nbsp;is as brief as
    the strike of a sword) or&nbsp;be rotted through. When the grey ooze
    hits&nbsp;a character in metal armor, the armor must&nbsp;make a saving
    throw of 10 or higher. Only&nbsp;cutting and piercing damages a grey
    ooze&nbsp;&mdash; it is impervious to blunt or crushing&nbsp;attacks.</p>
