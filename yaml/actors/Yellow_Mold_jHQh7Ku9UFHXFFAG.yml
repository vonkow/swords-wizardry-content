  description: >-
    <p class="p1">Yellow mold is a subterranean fungus; it&nbsp;neither moves
    nor attacks. However, if it&nbsp;is poked or struck, it may (50%
    chance)&nbsp;release a cloud (roughly 10 feet in diameter)&nbsp;of poisonous
    spores. Failing a saving throw&nbsp;against the spores means that the
    character&nbsp;dies a rather horrible death. Even just&nbsp;touching yellow
    mold inflicts 1d6 points&nbsp;of acid damage on the creature doing
    the&nbsp;touching. These growths can be destroyed&nbsp;with fire.</p>
