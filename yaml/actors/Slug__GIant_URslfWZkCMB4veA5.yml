  alignment: 'N'
  description: >-
    <p class="p1">These tremendously large masses of slimy,&nbsp;rubbery flesh
    are completely immune to&nbsp;blunt weapons. In addition to their powerful
    bite, giant slugs can spit their acidic saliva&nbsp;at one target at a time.
    The base range for&nbsp;spitting is 60 feet, and within this range
    the&nbsp;slug&rsquo;s spittle is 50% likely to hit (no other&nbsp;to-hit
    roll required). For every additional 10&nbsp;feet of range, the chance to
    hit decreases&nbsp;by 10%. On its first spitting attack, the slug&nbsp;has
    only a 10% chance to hit within 60&nbsp;feet, and no chance of hitting
    beyond that&nbsp;range. Some giant slugs might have more&nbsp;or less
    virulent acidity, thus changing the&nbsp;damage inflicted.</p>
  cl: 13
