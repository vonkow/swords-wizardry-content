  alignment: 'N'
  description: >-
    <p class="p1">Rakshasas are evil spirits from Indian mythology. Their true
    form is that of a demon&nbsp;with the head of a tiger or other
    predatory&nbsp;animal, but by magical illusion they always&nbsp;appear to
    others in a friendly or non-threatening form. Rakshasas can be affected
    only&nbsp;by the most powerful of spells (level 8 or 9),&nbsp;and they can
    be hit only with magical weapons. Crossbow bolts that have been
    blessed&nbsp;by a Cleric are the bane of the rakshasa &mdash;&nbsp;such
    bolts are treated as +3 weapons against&nbsp;them. Rakshasas are minor
    spellcasters, able&nbsp;to cast Magic-User spells (3/2/1) and
    Cleric&nbsp;spells (1). Typical spells for a rakshasa might&nbsp;be:</p>

    <p class="p1">Magic-User: 1st&mdash;magic missile (x3); 2nd&mdash;mirror
    image, web; 3rd&mdash;fly.&nbsp;Cleric: 1st&mdash;cure light wounds.</p>
