  alignment: 'N'
  description: >-
    <p class="p1">Zombies are mindless creatures, the walking&nbsp;dead. (These
    are merely animated corpses,&nbsp;not carriers of any sort of undead
    contagion as are ghouls.) If their undeath is contagious, they should be
    worth a few more&nbsp;experience points than described here, and&nbsp;if a
    single hit from a zombie causes contagion or any other sort of disease,
    they&nbsp;should be worth considerably more&nbsp;experience. However, the
    standard&nbsp;zombie is simply a corpse animated&nbsp;to do its
    creator&rsquo;s bidding.</p>
