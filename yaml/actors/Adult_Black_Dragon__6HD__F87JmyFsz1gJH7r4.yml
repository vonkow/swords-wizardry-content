  alignment: C
  description: >-
    <p class="p1">Black dragons spit a deadly, corrosive acid&nbsp;that covers
    everything in a line 5 feet wide&nbsp;and 60 feet long. Black dragons have a
    45%&nbsp;chance of being able to talk; talking black&nbsp;dragons have a 5%
    chance of being able to cast 1d4 1st-level Magic-User spells.</p>

    <hr>

    <p class="p1"><em>The size of a dragon is roughly 5 feet of&nbsp;body length
    per age category, up to the adult&nbsp;size of 20 feet. Dragons have double
    normal&nbsp;treasure (that is, a gold piece value of four&nbsp;times the
    dragon&rsquo;s XP value).&nbsp;Do not roll hit points for dragons as
    normal.&nbsp;Instead, determine the number of hit dice&nbsp;and the age
    category of the dragon. The age&nbsp;category indicates the dragon&rsquo;s
    hit points&nbsp;per die and how much damage the dragon&rsquo;s&nbsp;breath
    weapon inflicts, given as points per&nbsp;hit die:</em></p>

    <p class="p2"><em><strong>&bull; Very young dragon:</strong> 1 hit point per
    hit&nbsp;die; 1 hit point per die inflicted by breath&nbsp;weapon.</em></p>

    <p class="p2"><em><strong>&bull; Young:</strong> 2 hit points per hit die; 2
    hit points&nbsp;per die inflicted by breath weapon.</em></p>

    <p class="p2"><em><strong>&bull; Immature: </strong>3 hit points per hit
    die; 3 hit&nbsp;points per die inflicted by breath weapon.</em></p>

    <p class="p2"><em><strong>&bull; Adult:</strong> 4 hit points per hit die; 4
    hit points&nbsp;per die inflicted by breath weapon.</em></p>

    <p class="p2"><em><strong>&bull; Old: </strong>5 hit points per hit die; 5
    hit points per&nbsp;die inflicted by breath weapon.</em></p>

    <p class="p2"><em><strong>&bull; Very old </strong>(100 years old): 6 hit
    points per hit&nbsp;die; 6 hit points per die inflicted by
    breath&nbsp;weapon.</em></p>

    <p class="p2"><em><strong>&bull; Aged </strong>(101&ndash;400 years old): 7
    hit points per&nbsp;die; 7 hit points per die inflicted by
    breath&nbsp;weapon.</em></p>

    <p class="p2"><em><strong>&bull; Ancient</strong> (401+ years old): 8 hit
    points per&nbsp;die; 8 hit points per die inflicted by
    breath&nbsp;weapon.</em></p>
