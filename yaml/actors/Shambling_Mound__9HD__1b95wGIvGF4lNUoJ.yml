  alignment: 'N'
  description: >-
    <p class="p1">Shambling mounds are moving plants, huge&nbsp;masses of slimy
    vegetation that shamble&nbsp;through swamps and marshes looking
    for&nbsp;prey. They have a roughly bipedal shape,&nbsp;with two
    &ldquo;legs&rdquo; and two &ldquo;arms.&rdquo;&nbsp;Shambling mounds are
    immune to fire&nbsp;because of their slimy, wet bodies. They&nbsp;take only
    half damage from cold, and half&nbsp;damage from weapons of any kind.
    Electricity causes a shambling mound to gain one&nbsp;hit die. If a
    shambling mound hits with both&nbsp;arms, the victim is enfolded into the
    slimy&nbsp;body and suffocates in 2d4 melee rounds&nbsp;unless freed.</p>
