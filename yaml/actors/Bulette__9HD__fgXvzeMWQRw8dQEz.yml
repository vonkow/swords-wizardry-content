  alignment: 'N'
  description: >-
    <p class="p1">Roughly 10 feet in height, a bulette (boo-LAY) is covered in
    natural armor plating like&nbsp;that of an armadillo, and has a
    beak-like&nbsp;head that opens to show wicked, serrated teeth. These
    creatures can leap to the&nbsp;attack, in which case they cannot bite,
    but&nbsp;may attack with all four claws. Bulettes dig&nbsp;underground to
    surprise their prey, leaving&nbsp;a furrow in the ground as they go, caused
    by&nbsp;a dorsal crest in the creature&rsquo;s armor. These&nbsp;voracious
    hunters eat horses and halflings&nbsp;with gusto, although they will devour
    anything from badgers to plowshares if their&nbsp;preferred foods are not
    readily&nbsp;available. Although bulettes burrow, they&nbsp;do not venture
    farther underground, for&nbsp;they are surface predators. When the
    dorsal&nbsp;crest of the bulette is raised (during combat&nbsp;this is
    usually only after the thing has been&nbsp;wounded), the area underneath is
    AC 6[13],&nbsp;and this vulnerable point can be attacked if&nbsp;the monster
    is well enough surrounded for&nbsp;its opponents to attack from behind as
    well&nbsp;as in front.</p>
