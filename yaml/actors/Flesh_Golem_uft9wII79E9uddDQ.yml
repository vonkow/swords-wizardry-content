  alignment: 'N'
  description: >-
    <p class="p1">A creation stitched together from human&nbsp;limbs and other
    parts, a flesh golem is similar to Frankenstein&rsquo;s monster. Only +1
    or&nbsp;better magic weapons can harm a flesh golem, and it is slowed by
    fire and cold spells.&nbsp;Lightning heals the golem for the number&nbsp;of
    points of damage that it would normally&nbsp;inflict. No other type of spell
    affects a flesh&nbsp;golem.</p>

    <hr>

    <p class="p1"><em>Golems are man-shaped creatures built&nbsp;to serve their
    masters, usually powerful&nbsp;wizards or high priests. They are often
    used&nbsp;as guardians. Golems cannot be hit with&nbsp;non-magical weapons,
    and are immune to&nbsp;the sorts of spells used to create them
    (iron&nbsp;golems being immune to fire, for instance).&nbsp;You can find the
    details in the specific monster descriptions.</em></p>
