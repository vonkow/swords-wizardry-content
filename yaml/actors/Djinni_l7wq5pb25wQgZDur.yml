  description: >-
    <p class="p1"><em>Spell-like Abilities: at will</em>&mdash;create
    objects,&nbsp;gaseous form, invisibility.</p>

    <p class="p1">Djinn are one of the genies of folklore, creatures of the air
    (and possibly of the elemental planes). They can carry 700 pounds of weight
    and have a number of magical&nbsp;powers. A djinni can create food and
    water&nbsp;as well as wooden and cloth objects. They&nbsp;can also create
    objects of metal (including coins), but all such
    magically-created&nbsp;metals disappear in time. Djinn can call&nbsp;up
    illusions, and although these are quite&nbsp;excellent, they disappear when
    touched. A&nbsp;djinni can turn into a gaseous form (cannot&nbsp;attack or
    be attacked, can enter any area&nbsp;that is not airtight) and can become
    invisible&nbsp;at will. Finally, a djinni can turn itself into&nbsp;a
    whirlwind, sweeping away any creature&nbsp;with one or fewer hit dice. (The
    diameter&nbsp;of the whirlwind is 10 feet.) More powerful&nbsp;types of
    djinn might be capable of granting&nbsp;limited wishes or even true
    wishes.</p>
