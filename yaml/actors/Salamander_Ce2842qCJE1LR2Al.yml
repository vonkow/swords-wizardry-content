  alignment: C
  description: >-
    <p class="p1">Salamanders are intelligent creatures of&nbsp;the Elemental
    Planes of Fire. They have&nbsp;the upper body of a human and the
    lower&nbsp;body of a snake, and give off tremendous,&nbsp;intense heat. The
    very touch of a salamander deals 1d6 hit points of fire damage,&nbsp;and
    they wrap their tails around foes to&nbsp;cause an additional 2d8 points of
    crushing&nbsp;damage per round as the victim writhes in&nbsp;the deadly heat
    of the serpentine coils. The&nbsp;salamander&rsquo;s human torso is AC
    5[14], and&nbsp;the armored serpent-tail is AC 3[16]. Salamanders cannot be
    enslaved in the same&nbsp;manner djinn and efreet might be.</p>
