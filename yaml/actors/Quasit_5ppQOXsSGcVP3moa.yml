  alignment: C
  description: >-
    <p class="p1"><em>Spell-like abilities: at will</em>&mdash;invisibility;
    1/day&mdash;fear.</p>

    <p class="p1">Quasits are demon familiars, much like&nbsp;imps but without
    wings and with a less&nbsp;human-like shape. A quasit can
    polymorph&nbsp;into two other forms (commonly a giant&nbsp;centipede and a
    bat). These demons are&nbsp;25% resistant to magic, regenerate at 1
    hp&nbsp;per round, can become invisible at will,&nbsp;and once per day can
    cast a fear spell. The&nbsp;quasit&rsquo;s claws are laden with a poison
    that&nbsp;reduces an opponent&rsquo;s Dexterity score by&nbsp;1 point
    (saving throw applies, lasts for 2d6&nbsp;rounds).</p>

    <hr>

    <p class="p1"><em>Demons are creatures of the lower planes of existence, but
    they are occasionally encountered in places where they have been enslaved to
    serve as guardians by powerful Magic-Users or evil Clerics. The more
    intelligent varieties might also be interrupted while carrying out plots of
    their own. There is no meaningful game distinction between demons and
    devils; all are creatures of the lower planes.</em></p>
