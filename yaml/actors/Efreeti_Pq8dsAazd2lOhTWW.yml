  alignment: C
  description: >-
    <p class="p1">Efreet are a type of genie associated with&nbsp;fire (in
    contrast to the djinn, who have&nbsp;powers over the air). Efreet can carry
    up&nbsp;to 1,000 pounds of weight, and under the&nbsp;right circumstances
    they can be forced to&nbsp;serve as a slave until they figure out
    how&nbsp;to free themselves. An efreeti can create a&nbsp;wall of fire (per
    the spell). They appear as&nbsp;giant humans with cruel features, their
    skin&nbsp;flickering with flames.</p>
