  alignment: 'N'
  description: >-
    <p class="p1">Sea monsters generally resemble bizarre&nbsp;fish, long-necked
    monsters with seal-like&nbsp;bodies, or massive eels, although
    virtually&nbsp;all have a hide of incredibly tough scales.&nbsp;In general,
    their appearance is quite varied,&nbsp;for there does not appear to be a
    particular&nbsp;&ldquo;species&rdquo; of sea monster. Sea
    monsters&nbsp;swallow their prey whole, like sea serpents:&nbsp;if the
    attack roll is 4 over the required&nbsp;number (or a natural 20), the victim
    is swallowed, dies in an hour, and is fully digested&nbsp;within a day. Sea
    monsters are not generally venomous. They are generally encountered
    underwater; unlike sea serpents, they&nbsp;seldom venture to the
    surface.</p>
