  alignment: 'N'
  description: >-
    <p class="p1">Black puddings are amorphous globs with&nbsp;an acidic
    surface. They are subterranean&nbsp;predators and scavengers. Any weapon
    or&nbsp;armor contacting a black pudding will be&nbsp;eaten away by the acid
    as follows: weapon&nbsp;(1 hit by weapon), chainmail or lesser armor (1 hit
    by pudding), plate mail (2 hits by&nbsp;pudding). If a weapon or armor is
    magical,&nbsp;it can take an additional hit per magical +1&nbsp;before being
    dissolved.</p>
