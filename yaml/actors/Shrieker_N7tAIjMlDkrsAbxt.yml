  alignment: 'N'
  description: >-
    <p class="p1">Shriekers are huge mushrooms with tough,&nbsp;fibrous bodies.
    They do not physically&nbsp;attack, but if light shines on them (or
    within&nbsp;about 30 feet) or if anything moves near&nbsp;them (within about
    10 feet), they emit a&nbsp;high-pitched shrieking noise. This
    noise&nbsp;causes 1 hp damage per round (saving throw&nbsp;applies) to
    anyone nearby (within 30 feet).&nbsp;The true danger of shriekers is that
    they&nbsp;tend to summon wandering monsters. If&nbsp;they are attacked with
    missile weapons, they&nbsp;attempt to shuffle away, although they
    do&nbsp;not move very fast.</p>
