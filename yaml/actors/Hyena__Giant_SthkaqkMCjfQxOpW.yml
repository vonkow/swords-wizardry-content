  alignment: 'N'
  description: >-
    <p class="p1">Hyenas are pack-hunters and scavengers,&nbsp;known for the
    eerie laughing sound they&nbsp;make. They are not normally much of
    a&nbsp;threat, although they may attack weak-looking foes if they have
    sufficient numbers.&nbsp;Giant hyenas stand 8ft tall at the
    shoulder,&nbsp;and are more aggressive than their normal&nbsp;cousins. They
    might serve as mounts for&nbsp;tribes of gnolls in prehistoric or sword
    &amp;&nbsp;sorcery campaigns.</p>
