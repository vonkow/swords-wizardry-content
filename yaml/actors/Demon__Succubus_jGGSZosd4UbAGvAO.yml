  alignment: C
  description: >-
    <p class="p1"><em>Spell-like abilities: at will</em>&mdash;charm
    person,&nbsp;clairaudience, darkness 15ft radius, ESP,&nbsp;suggestion.</p>

    <p class="p1">A succubus is a creature of demonic lust,&nbsp;a drinker of
    souls who offers fatal temptation to mortals who fall into the trap
    of&nbsp;her deadly embraces: each kiss drains one&nbsp;level of experience.
    (The male form of this&nbsp;demon is called an incubus. A succubus
    is&nbsp;always female, just as an incubus is always&nbsp;male.) The
    demon&rsquo;s form is that of a supernaturally beautiful woman, curvaceous
    and&nbsp;alluring, but whose furled bat wings and&nbsp;delicate horns betray
    her true nature. Small&nbsp;white fangs gleam from behind the
    demoness&rsquo;s full lips, and when she is enraged, the&nbsp;pupils of her
    eyes contract and shift into&nbsp;those of a vicious serpent.</p>

    <p class="p1">A succubus can &ldquo;cast&rdquo; charm person whenever
    desired, as well as ESP, clairaudience,&nbsp;and suggestion. They can change
    shape at&nbsp;will, but only into human or human-like&nbsp;forms. Succubi
    also have the ability to call&nbsp;forth (by gate) other demons. A
    succubus&nbsp;can summon a demon prince (40% chance&nbsp;to succeed), but
    seldom does so, for the price&nbsp;to be paid afterward is generally
    significant&nbsp;and unpleasant. However, a succubus can&nbsp;summon a
    baalroch demon or a nalfeshnee&nbsp;(fourth-category demon), again, with a
    40%&nbsp;chance of success regardless of the type&nbsp;of demon being
    summoned. If a succubus&nbsp;does not specify the sort of demon she
    is&nbsp;summoning, there is a 5% chance that the&nbsp;respondent is a demon
    prince, and if not,&nbsp;there is a 75% chance that the demon is of&nbsp;the
    fourth category, a nalfeshnee.</p>

    <p class="p1">Succubi almost never rely upon physical&nbsp;attacks; they use
    their charm and suggestion&nbsp;abilities to allow them to bestow their
    deadly&nbsp;kisses upon opponents.</p>

    <hr>

    <p class="p1"><em>Demons are creatures of the lower planes of existence, but
    they are occasionally encountered in places where they have been enslaved to
    serve as guardians by powerful Magic-Users or evil Clerics. The more
    intelligent varieties might also be interrupted while carrying out plots of
    their own. There is no meaningful game distinction between demons and
    devils; all are creatures of the lower planes.</em></p>
