  alignment: 'N'
  description: >-
    <p class="p1">Giant fish can range from something barely larger than a shark
    to something as large as a whale. In general, these creatures will be at
    least 11 feet long and have 1HD per 2 feet of length. Thus, if rolling
    randomly for a giant fish, roll 1d10+10 feet to determine the length, and
    the hit dice will be half that number. If the roll is a &ldquo;10&rdquo;
    (i.e., the fish would be 20 feet long), then it is a REALLY giant fish; roll
    1d20 for additional feet in length. Thus, the maximum size for a giant fish
    is 40 feet, and for some unknown reason giant fish never seem to be exactly
    20 feet in length; a matter for philosophers to puzzle upon. The truly giant
    fish can most likely swallow people whole on a natural roll of 18&ndash;20.
    Use the rules for creating monsters to determine the saving throws and
    experience point values of the varying sizes of giant fish. Giant fish might
    be intelligent (5% chance), in which case they might have an alignment other
    than Neutrality.</p>
