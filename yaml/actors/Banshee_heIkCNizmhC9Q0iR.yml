  alignment: C
  description: >-
    <p class="p1">Banshees are horrid undead creatures that&nbsp;live in swamps
    and other desolate places.&nbsp;Banshees are damaged only by magic
    or&nbsp;silver weapons, they have a magic resistance&nbsp;of 49%, and they
    are immune to enchantments. Their shriek (once per day) necessitates a
    saving throw versus death or the&nbsp;hearer dies in 2d6 rounds. One
    particularly unusual thing about banshees is that they&nbsp;often associate
    with living faerie creatures of&nbsp;the less savory variety; they might
    even be&nbsp;an undead form of faerie.</p>

    <p class="p1">A banshee can travel over water and other&nbsp;terrain as if
    it were land, but crossing&nbsp;running water causes it to lose its
    magic&nbsp;resistance for 3d6 hours. Banshees look like&nbsp;gaunt humans
    (male or female) with long,&nbsp;stringy hair and glowing yellow eyes.
    They&nbsp;often wear hooded cloaks. They are considered Type 9 undead for
    turning purposes.</p>
