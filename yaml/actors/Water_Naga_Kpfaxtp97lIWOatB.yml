  alignment: Any
  description: >-
    <p class="p1">Water nagas might be of any alignment.&nbsp;They do not
    ordinarily have human heads,&nbsp;but like the guardian nagas they will
    have&nbsp;some physical attributes separating them&nbsp;clearly from normal
    serpents. In the case&nbsp;of water nagas, this might be the color
    of&nbsp;the scales or the presence of flowing beard-like fins, perhaps.
    Water nagas are from 10&nbsp;to 15ft long. Water nagas cast
    magic-user&nbsp;spells (4/2/1). A sample spell selection for&nbsp;a water
    naga might be: level 1: <em>charm person </em>x2, <em>magic missile,
    sleep</em>; level 2: <em>mirror image, </em><em>web</em>; level 3:
    <em>protection from normal missiles</em>.</p>

    <hr>

    <p class="p1"><em>&ldquo;Naga&rdquo; is the Sanskrit word for dragon
    or&nbsp;snake. In mythology, the naga are benevolent and very powerful,
    equivalent to Asian&nbsp;dragons. The nagas portrayed here are&nbsp;more
    serpentine and less powerful; all have&nbsp;the body of a snake, although
    the head is&nbsp;not necessarily that of a serpent. All kinds&nbsp;of
    interesting abilities may be found in&nbsp;&ldquo;unusual&rdquo; nagas
    designed by the Referee,&nbsp;from breathing fire to moving in and out
    of&nbsp;strange planes of existence.</em></p>
