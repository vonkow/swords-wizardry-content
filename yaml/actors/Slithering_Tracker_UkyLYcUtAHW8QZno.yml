  alignment: 'N'
  description: >-
    <p class="p1">Perhaps the most dangerous of wandering&nbsp;monsters,
    slithering trackers are a form&nbsp;of transparent slug and may be related
    to&nbsp;gelatinous cubes. They are difficult to see&nbsp;(10% chance for a
    person to spot it, and he&nbsp;may lose sight of it again in the next
    round).&nbsp;Unless they are starving, they do not attack&nbsp;moving prey
    (5% chance to be starving). Instead, they follow the potential prey until
    it&nbsp;sleeps or camps. They can ooze under doors&nbsp;and through fairly
    small cracks, so even a&nbsp;barricaded room with a closed door is probably
    not safe. When it attacks, the victim&nbsp;must make a saving throw or be
    paralyzed&nbsp;by the slitherer&rsquo;s secretions. A paralyzed&nbsp;victim
    is sucked dry of all body fluids in 5&nbsp;turns (50 minutes), losing 20% of
    hit points&nbsp;each 10 minutes.</p>
